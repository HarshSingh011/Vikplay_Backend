<!DOCTYPE html>
<html>
<head>
    <title>WebRTC Test - Broadcaster</title>
    <style>
        body { font-family: Arial; max-width: 800px; margin: 50px auto; padding: 20px; }
        video { width: 100%; max-width: 640px; background: #000; border-radius: 8px; }
        button { padding: 12px 24px; margin: 10px 5px; font-size: 16px; cursor: pointer; border-radius: 5px; }
        .start { background: #10b981; color: white; border: none; }
        .stop { background: #ef4444; color: white; border: none; }
        .status { padding: 15px; margin: 10px 0; border-radius: 5px; font-weight: bold; }
        .live { background: #d1fae5; color: #065f46; }
        .offline { background: #fee2e2; color: #991b1b; }
        #log { background: #1f2937; color: #10b981; padding: 15px; border-radius: 5px; height: 200px; overflow-y: auto; font-family: monospace; }
    </style>
</head>
<body>
    <h1>🎥 WebRTC Broadcaster (Test Mode)</h1>
    
    <div>
        <label>Stream ID: <input type="number" id="streamId" value="1" style="padding: 8px; font-size: 16px;"></label>
    </div>
    
    <div id="status" class="status offline">⚫ Not Streaming</div>
    
    <video id="localVideo" autoplay muted playsinline></video>
    
    <div>
        <button class="start" onclick="startStream()">▶️ Start Broadcasting</button>
        <button class="stop" onclick="stopStream()">⏹️ Stop Broadcasting</button>
    </div>
    
    <div style="margin-top: 20px;">
        <strong>Viewers: <span id="viewers">0</span></strong>
    </div>
    
    <h3>Console:</h3>
    <div id="log"></div>

    <script>
        const WS_URL = 'ws://localhost:8000';
        let localStream = null;
        let websocket = null;
        let peerConnections = {};
        
        const rtcConfig = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        };
        
        function log(msg) {
            const logDiv = document.getElementById('log');
            const time = new Date().toLocaleTimeString();
            logDiv.innerHTML += `[${time}] ${msg}<br>`;
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(msg);
        }
        
        async function startStream() {
            const streamId = document.getElementById('streamId').value;
            
            try {
                log('🎥 Getting camera access...');
                localStream = await navigator.mediaDevices.getUserMedia({
                    video: true,
                    audio: true
                });
                
                document.getElementById('localVideo').srcObject = localStream;
                log('✅ Camera access granted!');
                
                // Connect to WebSocket (TEST MODE - no token required)
                const wsUrl = `${WS_URL}/api/webrtc/ws/test/broadcast/${streamId}`;
                log(`🔌 Connecting to ${wsUrl}...`);
                
                websocket = new WebSocket(wsUrl);
                
                websocket.onopen = () => {
                    log('✅ WebSocket connected! You are LIVE!');
                    document.getElementById('status').className = 'status live';
                    document.getElementById('status').textContent = '🟢 LIVE';
                };
                
                websocket.onmessage = async (event) => {
                    const data = JSON.parse(event.data);
                    await handleSignal(data);
                };
                
                websocket.onerror = (error) => {
                    log(`❌ WebSocket error: ${error}`);
                };
                
                websocket.onclose = () => {
                    log('🔌 WebSocket closed');
                    document.getElementById('status').className = 'status offline';
                    document.getElementById('status').textContent = '⚫ Not Streaming';
                };
                
            } catch (error) {
                log(`❌ Error: ${error.message}`);
                alert('Failed to access camera. Please grant permissions.');
            }
        }
        
        async function handleSignal(data) {
            const { type, source } = data;
            log(`📨 Received: ${type} ${source ? 'from ' + source : ''}`);
            
            switch (type) {
                case 'offer':
                    await handleOffer(data);
                    break;
                case 'ice_candidate':
                    await handleIceCandidate(data);
                    break;
                case 'viewer_count':
                    document.getElementById('viewers').textContent = data.count;
                    log(`👥 Viewers: ${data.count}`);
                    break;
            }
        }
        
        async function handleOffer(data) {
            const { source, sdp } = data;
            log(`🤝 Creating peer connection for ${source}`);
            
            const pc = new RTCPeerConnection(rtcConfig);
            peerConnections[source] = pc;
            
            localStream.getTracks().forEach(track => {
                pc.addTrack(track, localStream);
                log(`➕ Added ${track.kind} track to peer connection`);
            });
            
            pc.onicecandidate = (event) => {
                if (event.candidate) {
                    log(`📡 Sending ICE candidate to ${source}`);
                    websocket.send(JSON.stringify({
                        type: 'ice_candidate',
                        candidate: event.candidate.candidate,
                        sdpMLineIndex: event.candidate.sdpMLineIndex,
                        sdpMid: event.candidate.sdpMid,
                        target: source
                    }));
                }
            };
            
            pc.oniceconnectionstatechange = () => {
                log(`ICE state for ${source}: ${pc.iceConnectionState}`);
            };
            
            pc.onconnectionstatechange = () => {
                log(`Connection state for ${source}: ${pc.connectionState}`);
            };
            
            await pc.setRemoteDescription(new RTCSessionDescription({ type: 'offer', sdp }));
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);
            
            websocket.send(JSON.stringify({
                type: 'answer',
                sdp: answer.sdp,
                target: source
            }));
            
            log(`✅ Sent answer to ${source}`);
        }
        
        async function handleIceCandidate(data) {
            const { source, candidate, sdpMLineIndex, sdpMid } = data;
            if (peerConnections[source]) {
                await peerConnections[source].addIceCandidate(
                    new RTCIceCandidate({ candidate, sdpMLineIndex, sdpMid })
                );
            }
        }
        
        function stopStream() {
            log('⏹️ Stopping stream...');
            
            if (websocket) {
                websocket.close();
            }
            
            Object.values(peerConnections).forEach(pc => pc.close());
            peerConnections = {};
            
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                document.getElementById('localVideo').srcObject = null;
            }
            
            document.getElementById('viewers').textContent = '0';
            log('✅ Stream stopped');
        }
        
        log('Ready! Enter stream ID and click "Start Broadcasting"');
    </script>
</body>
</html>
