<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Video Call Interface</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .main-container {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 400px 1fr;
            gap: 20px;
            height: calc(100vh - 40px);
        }

        .sidebar {
            background: white;
            border-radius: 15px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .main-content {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h2 {
            color: #667eea;
            margin-bottom: 20px;
        }

        .login-section {
            display: block;
        }

        .login-section.hidden {
            display: none;
        }

        .connected-section {
            display: none;
        }

        .connected-section.show {
            display: block;
        }

        input, button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            background: #667eea;
            color: white;
            font-weight: 600;
            cursor: pointer;
            border: none;
        }

        button:hover:not(:disabled) {
            background: #5568d3;
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .status {
            padding: 10px;
            border-radius: 8px;
            margin: 10px 0;
            font-size: 13px;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
        }

        .status.info {
            background: #d1ecf1;
            color: #0c5460;
        }

        .user-list {
            flex: 1;
            overflow-y: auto;
            margin-top: 20px;
        }

        .user-item {
            padding: 15px;
            border: 2px solid #eee;
            border-radius: 10px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
        }

        .user-item:hover {
            border-color: #667eea;
            background: #f8f9ff;
        }

        .user-info {
            flex: 1;
        }

        .user-name {
            font-weight: 600;
            color: #333;
        }

        .user-email {
            font-size: 12px;
            color: #666;
        }

        .call-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #00a884;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
        }

        .call-btn:hover {
            background: #06cf9c;
        }

        .debug-console {
            background: #1a1a1a;
            color: #00ff00;
            padding: 15px;
            border-radius: 10px;
            height: 400px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            margin-top: 20px;
        }

        .debug-log {
            margin-bottom: 5px;
            padding: 3px 0;
        }

        .debug-log.error {
            color: #ff6b6b;
        }

        .debug-log.success {
            color: #51cf66;
        }

        .debug-log.info {
            color: #4dabf7;
        }

        .test-credentials {
            background: #fff3cd;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 13px;
        }

        .test-credentials h4 {
            margin-bottom: 10px;
            color: #856404;
        }

        .cred-item {
            margin: 5px 0;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <h2>📞 Video Calls</h2>
            
            <!-- Login Section -->
            <div id="loginSection" class="login-section">
                <div class="test-credentials">
                    <h4>🔑 Test Credentials:</h4>
                    <div class="cred-item"><strong>User 1:</strong> caller@test.com / Test123!</div>
                    <div class="cred-item"><strong>User 2:</strong> receiver@test.com / Test123!</div>
                </div>
                
                <input type="email" id="email" placeholder="Email" value="caller@test.com">
                <input type="password" id="password" placeholder="Password" value="Test123!">
                <button onclick="login()">🔐 Login & Connect</button>
            </div>

            <!-- Connected Section -->
            <div id="connectedSection" class="connected-section">
                <div id="statusMessage" class="status info"></div>
                <input type="text" id="searchInput" placeholder="Search users..." oninput="searchUsers()">
                <div id="userList" class="user-list"></div>
                <button onclick="disconnect()" style="background: #dc3545; margin-top: 20px;">Disconnect</button>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <h2>📺 Debug Console</h2>
            <button onclick="clearDebug()" style="width: auto; padding: 8px 20px; margin-bottom: 10px;">Clear Console</button>
            <div id="debugConsole" class="debug-console"></div>
        </div>
    </div>

    <script>
        let ws = null;
        let token = null;
        let currentUser = null;

        // Debug logging
        function debugLog(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const logDiv = document.createElement('div');
            logDiv.className = `debug-log ${type}`;
            logDiv.textContent = `[${timestamp}] ${message}`;
            
            const console = document.getElementById('debugConsole');
            console.appendChild(logDiv);
            console.scrollTop = console.scrollHeight;
        }

        function clearDebug() {
            document.getElementById('debugConsole').innerHTML = '';
        }

        function showStatus(message, type) {
            const statusEl = document.getElementById('statusMessage');
            statusEl.textContent = message;
            statusEl.className = `status ${type}`;
        }

        // Login and connect
        async function login() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();

            debugLog('🔐 Attempting login...', 'info');

            try {
                // Step 1: Login to get JWT token
                const loginResponse = await fetch('http://localhost:8000/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                if (!loginResponse.ok) {
                    const error = await loginResponse.json();
                    debugLog(`❌ Login failed: ${error.detail}`, 'error');
                    alert('Login failed: ' + error.detail);
                    return;
                }

                const loginData = await loginResponse.json();
                token = loginData.access_token;
                
                debugLog('✅ Login successful!', 'success');
                debugLog(`Token: ${token.substring(0, 30)}...`, 'info');

                // Decode token
                const payload = JSON.parse(atob(token.split('.')[1]));
                currentUser = {
                    id: payload.user_id,
                    email: payload.sub
                };
                
                debugLog(`User ID: ${currentUser.id}, Email: ${currentUser.email}`, 'info');

                // Step 2: Connect WebSocket
                connectWebSocket();

            } catch (error) {
                debugLog(`❌ Error: ${error.message}`, 'error');
                alert('Failed to login: ' + error.message);
            }
        }

        function connectWebSocket() {
            debugLog('🔌 Connecting to WebSocket...', 'info');
            
            const wsUrl = `ws://localhost:8000/calls/ws?token=${encodeURIComponent(token)}`;
            debugLog(`WebSocket URL: ${wsUrl.substring(0, 60)}...`, 'info');
            
            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                debugLog('✅ WebSocket connected!', 'success');
                showStatus(`✅ Connected as ${currentUser.email}`, 'success');
                
                // Switch UI
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('connectedSection').classList.add('show');
                
                // Load users
                loadUsers();
            };

            ws.onmessage = (event) => {
                const message = JSON.parse(event.data);
                debugLog(`📨 Received: ${message.type}`, 'info');
                debugLog(`Data: ${JSON.stringify(message.data)}`, 'info');
            };

            ws.onerror = (error) => {
                debugLog(`❌ WebSocket error!`, 'error');
                debugLog(`Error: ${JSON.stringify(error)}`, 'error');
            };

            ws.onclose = (event) => {
                debugLog(`⚠️ WebSocket closed! Code: ${event.code}, Reason: ${event.reason || 'None'}`, 'error');
                showStatus('❌ Disconnected', 'error');
            };
        }

        async function loadUsers() {
            debugLog('👥 Loading users...', 'info');

            try {
                const response = await fetch('http://localhost:8000/calls/users/search', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                debugLog(`Users API response: ${response.status} ${response.statusText}`, 'info');

                if (!response.ok) {
                    const errorText = await response.text();
                    debugLog(`❌ Failed to load users: ${errorText}`, 'error');
                    return;
                }

                const users = await response.json();
                debugLog(`✅ Loaded ${users.length} users`, 'success');
                
                displayUsers(users);
            } catch (error) {
                debugLog(`❌ Error loading users: ${error.message}`, 'error');
            }
        }

        function displayUsers(users) {
            const userList = document.getElementById('userList');
            userList.innerHTML = '';

            if (users.length === 0) {
                userList.innerHTML = '<div style="padding: 20px; text-align: center; color: #666;">No users found</div>';
                return;
            }

            users.forEach(user => {
                debugLog(`User: ${user.username} (ID: ${user.id}, Email: ${user.email})`, 'info');
                
                const userDiv = document.createElement('div');
                userDiv.className = 'user-item';
                userDiv.innerHTML = `
                    <div class="user-info">
                        <div class="user-name">${user.username}</div>
                        <div class="user-email">ID: ${user.id} | ${user.email}</div>
                    </div>
                    <button class="call-btn" onclick="callUser(${user.id}, '${user.username}')">📞</button>
                `;
                userList.appendChild(userDiv);
            });
        }

        function callUser(userId, username) {
            debugLog(`📞 Calling ${username} (ID: ${userId})`, 'info');
            alert(`Calling ${username}... (Feature coming soon)`);
        }

        function disconnect() {
            if (ws) {
                ws.close();
                ws = null;
            }
            token = null;
            currentUser = null;
            
            document.getElementById('loginSection').classList.remove('hidden');
            document.getElementById('connectedSection').classList.remove('show');
            
            debugLog('👋 Disconnected', 'info');
        }

        async function searchUsers() {
            const query = document.getElementById('searchInput').value;
            
            try {
                const response = await fetch(`http://localhost:8000/calls/users/search?query=${encodeURIComponent(query)}`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                const users = await response.json();
                displayUsers(users);
            } catch (error) {
                debugLog(`❌ Search error: ${error.message}`, 'error');
            }
        }

        // Initialize
        window.addEventListener('DOMContentLoaded', () => {
            debugLog('🚀 Simple Call Interface loaded', 'success');
            debugLog('Ready to connect...', 'info');
        });
    </script>
</body>
</html>
