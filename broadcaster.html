<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRTC Broadcaster - VikPay</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .content {
            padding: 30px;
        }

        .video-section {
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 20px;
            position: relative;
        }

        #localVideo {
            width: 100%;
            height: auto;
            min-height: 400px;
            display: block;
            background: #1a1a1a;
        }

        .status-bar {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .status-badge {
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ef4444;
            animation: pulse 2s ease-in-out infinite;
        }

        .status-dot.live {
            background: #10b981;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .viewer-count {
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: 600;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-weight: 600;
            color: #374151;
            font-size: 0.9em;
        }

        .form-group input,
        .form-group textarea {
            padding: 12px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .button-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        button {
            padding: 14px 28px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            flex: 1;
            min-width: 150px;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-danger {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
        }

        .btn-danger:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4);
        }

        .btn-secondary {
            background: #6b7280;
            color: white;
        }

        .btn-secondary:hover:not(:disabled) {
            background: #4b5563;
        }

        .info-panel {
            background: #f9fafb;
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #e5e7eb;
        }

        .info-item:last-child {
            border-bottom: none;
        }

        .info-label {
            font-weight: 600;
            color: #6b7280;
        }

        .info-value {
            color: #111827;
            font-family: monospace;
        }

        .log-console {
            background: #1f2937;
            color: #10b981;
            padding: 15px;
            border-radius: 8px;
            height: 200px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            margin-top: 20px;
        }

        .log-entry {
            margin: 5px 0;
            padding: 3px 0;
        }

        .log-error {
            color: #ef4444;
        }

        .log-success {
            color: #10b981;
        }

        .log-info {
            color: #3b82f6;
        }

        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .alert-error {
            background: #fee2e2;
            color: #991b1b;
            border-left: 4px solid #ef4444;
        }

        .alert-success {
            background: #d1fae5;
            color: #065f46;
            border-left: 4px solid #10b981;
        }

        .alert-info {
            background: #dbeafe;
            color: #1e40af;
            border-left: 4px solid #3b82f6;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎥 WebRTC Broadcaster</h1>
            <p>Start streaming to your audience in real-time</p>
        </div>

        <div class="content">
            <div id="alertContainer"></div>

            <div class="video-section">
                <div class="status-bar">
                    <div class="status-badge">
                        <span class="status-dot" id="statusDot"></span>
                        <span id="statusText">Not Connected</span>
                    </div>
                    <div class="viewer-count" id="viewerCount">👥 0 Viewers</div>
                </div>
                <video id="localVideo" autoplay muted playsinline></video>
            </div>

            <div class="controls">
                <div class="form-group">
                    <label for="authToken">Authentication Token</label>
                    <input type="text" id="authToken" placeholder="Enter your JWT token">
                </div>

                <div class="form-group">
                    <label for="streamId">Stream ID</label>
                    <input type="number" id="streamId" placeholder="Enter stream ID">
                </div>

                <div class="form-group">
                    <label for="streamTitle">Stream Title</label>
                    <input type="text" id="streamTitle" placeholder="My Awesome Stream">
                </div>
            </div>

            <div class="form-group">
                <label for="streamDescription">Stream Description</label>
                <textarea id="streamDescription" placeholder="Tell viewers what your stream is about..."></textarea>
            </div>

            <div class="button-group">
                <button class="btn-secondary" id="getMediaBtn">📹 Get Camera</button>
                <button class="btn-primary" id="startStreamBtn" disabled>🚀 Start Streaming</button>
                <button class="btn-danger" id="stopStreamBtn" disabled>⏹️ Stop Stream</button>
            </div>

            <div class="info-panel">
                <h3 style="margin-bottom: 15px;">Stream Information</h3>
                <div class="info-item">
                    <span class="info-label">Server URL:</span>
                    <span class="info-value" id="serverUrl">ws://localhost:8000</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Connection State:</span>
                    <span class="info-value" id="connectionState">Disconnected</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Stream State:</span>
                    <span class="info-value" id="streamState">Idle</span>
                </div>
            </div>

            <div class="log-console" id="logConsole">
                <div class="log-entry log-info">Console initialized. Ready to start broadcasting...</div>
            </div>
        </div>
    </div>

    <script>
        // Configuration
        const WS_BASE_URL = 'ws://localhost:8000';
        const API_BASE_URL = 'http://localhost:8000';

        // WebRTC configuration
        const rtcConfig = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        };

        // State
        let localStream = null;
        let websocket = null;
        let peerConnections = {}; // viewer_id -> RTCPeerConnection
        let viewerCount = 0;

        // DOM Elements
        const localVideo = document.getElementById('localVideo');
        const authTokenInput = document.getElementById('authToken');
        const streamIdInput = document.getElementById('streamId');
        const streamTitleInput = document.getElementById('streamTitle');
        const streamDescriptionInput = document.getElementById('streamDescription');
        const getMediaBtn = document.getElementById('getMediaBtn');
        const startStreamBtn = document.getElementById('startStreamBtn');
        const stopStreamBtn = document.getElementById('stopStreamBtn');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const viewerCountEl = document.getElementById('viewerCount');
        const connectionState = document.getElementById('connectionState');
        const streamState = document.getElementById('streamState');
        const logConsole = document.getElementById('logConsole');
        const alertContainer = document.getElementById('alertContainer');

        // Logging
        function log(message, type = 'info') {
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logConsole.appendChild(entry);
            logConsole.scrollTop = logConsole.scrollHeight;
            console.log(message);
        }

        function showAlert(message, type = 'info') {
            const alert = document.createElement('div');
            alert.className = `alert alert-${type}`;
            alert.textContent = message;
            alertContainer.appendChild(alert);
            setTimeout(() => alert.remove(), 5000);
        }

        // Get user media
        async function getMedia() {
            try {
                log('Requesting camera and microphone access...', 'info');
                localStream = await navigator.mediaDevices.getUserMedia({
                    video: { width: 1280, height: 720 },
                    audio: true
                });
                localVideo.srcObject = localStream;
                log('Camera and microphone access granted!', 'success');
                showAlert('Camera ready! You can now start streaming.', 'success');
                startStreamBtn.disabled = false;
                getMediaBtn.disabled = true;
                updateStreamState('Ready');
            } catch (error) {
                log(`Error accessing media: ${error.message}`, 'error');
                showAlert('Failed to access camera/microphone. Please grant permissions.', 'error');
            }
        }

        // Connect to WebSocket
        async function connectWebSocket() {
            const token = authTokenInput.value.trim();
            const streamId = streamIdInput.value.trim();

            if (!token || !streamId) {
                showAlert('Please enter both authentication token and stream ID', 'error');
                return;
            }

            const wsUrl = `${WS_BASE_URL}/api/webrtc/ws/broadcast/${streamId}?token=${token}`;
            log(`Connecting to WebSocket: ${wsUrl}`, 'info');

            websocket = new WebSocket(wsUrl);

            websocket.onopen = () => {
                log('WebSocket connected successfully!', 'success');
                updateStatus('Connected', true);
                updateConnectionState('Connected');
                showAlert('Connected to server! You are now live!', 'success');
            };

            websocket.onmessage = async (event) => {
                const data = JSON.parse(event.data);
                await handleSignal(data);
            };

            websocket.onerror = (error) => {
                log(`WebSocket error: ${error}`, 'error');
                showAlert('Connection error occurred', 'error');
            };

            websocket.onclose = (event) => {
                log(`WebSocket closed: ${event.code} - ${event.reason}`, 'info');
                updateStatus('Disconnected', false);
                updateConnectionState('Disconnected');
                showAlert('Disconnected from server', 'info');
                cleanup();
            };
        }

        // Handle incoming signals
        async function handleSignal(data) {
            const { type, source } = data;

            log(`Received signal: ${type} from ${source || 'server'}`, 'info');

            switch (type) {
                case 'offer':
                    await handleOffer(data);
                    break;
                case 'ice_candidate':
                    await handleIceCandidate(data);
                    break;
                case 'viewer_count':
                    updateViewerCount(data.count);
                    break;
                case 'pong':
                    // Keep-alive response
                    break;
                default:
                    log(`Unknown signal type: ${type}`, 'info');
            }
        }

        // Handle offer from viewer
        async function handleOffer(data) {
            const { source, sdp } = data;
            log(`Creating peer connection for viewer: ${source}`, 'info');

            // Create new peer connection for this viewer
            const pc = new RTCPeerConnection(rtcConfig);
            peerConnections[source] = pc;

            // Add local stream tracks to the connection
            localStream.getTracks().forEach(track => {
                pc.addTrack(track, localStream);
            });

            // Handle ICE candidates
            pc.onicecandidate = (event) => {
                if (event.candidate) {
                    websocket.send(JSON.stringify({
                        type: 'ice_candidate',
                        candidate: event.candidate.candidate,
                        sdpMLineIndex: event.candidate.sdpMLineIndex,
                        sdpMid: event.candidate.sdpMid,
                        target: source
                    }));
                }
            };

            pc.onconnectionstatechange = () => {
                log(`Peer connection state (${source}): ${pc.connectionState}`, 'info');
            };

            // Set remote description (offer)
            await pc.setRemoteDescription(new RTCSessionDescription({ type: 'offer', sdp }));

            // Create answer
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);

            // Send answer back to viewer
            websocket.send(JSON.stringify({
                type: 'answer',
                sdp: answer.sdp,
                target: source
            }));

            log(`Sent answer to viewer: ${source}`, 'success');
        }

        // Handle ICE candidate from viewer
        async function handleIceCandidate(data) {
            const { source, candidate, sdpMLineIndex, sdpMid } = data;

            if (peerConnections[source]) {
                await peerConnections[source].addIceCandidate(
                    new RTCIceCandidate({ candidate, sdpMLineIndex, sdpMid })
                );
                log(`Added ICE candidate from viewer: ${source}`, 'info');
            }
        }

        // Start streaming
        async function startStreaming() {
            if (!localStream) {
                showAlert('Please get camera access first', 'error');
                return;
            }

            await connectWebSocket();
            startStreamBtn.disabled = true;
            stopStreamBtn.disabled = false;
            getMediaBtn.disabled = true;
            updateStreamState('Live');
        }

        // Stop streaming
        function stopStreaming() {
            log('Stopping stream...', 'info');

            if (websocket) {
                websocket.close();
            }

            cleanup();
            updateStatus('Stopped', false);
            updateStreamState('Stopped');
            startStreamBtn.disabled = false;
            stopStreamBtn.disabled = true;
            getMediaBtn.disabled = false;
            showAlert('Stream stopped successfully', 'info');
        }

        // Cleanup
        function cleanup() {
            // Close all peer connections
            Object.values(peerConnections).forEach(pc => pc.close());
            peerConnections = {};

            // Stop local stream
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
                localVideo.srcObject = null;
            }

            viewerCount = 0;
            updateViewerCount(0);
        }

        // UI Updates
        function updateStatus(text, isLive) {
            statusText.textContent = text;
            if (isLive) {
                statusDot.classList.add('live');
            } else {
                statusDot.classList.remove('live');
            }
        }

        function updateViewerCount(count) {
            viewerCount = count;
            viewerCountEl.textContent = `👥 ${count} Viewer${count !== 1 ? 's' : ''}`;
            log(`Viewer count updated: ${count}`, 'info');
        }

        function updateConnectionState(state) {
            connectionState.textContent = state;
        }

        function updateStreamState(state) {
            streamState.textContent = state;
        }

        // Event Listeners
        getMediaBtn.addEventListener('click', getMedia);
        startStreamBtn.addEventListener('click', startStreaming);
        stopStreamBtn.addEventListener('click', stopStreaming);

        // Keep-alive ping every 30 seconds
        setInterval(() => {
            if (websocket && websocket.readyState === WebSocket.OPEN) {
                websocket.send(JSON.stringify({ type: 'ping' }));
            }
        }, 30000);

        log('Broadcaster ready. Click "Get Camera" to start.', 'success');
    </script>
</body>
</html>
