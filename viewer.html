<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRTC Viewer - VikPay</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .content {
            padding: 30px;
        }

        .video-section {
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 20px;
            position: relative;
        }

        #remoteVideo {
            width: 100%;
            height: auto;
            min-height: 400px;
            display: block;
            background: #1a1a1a;
        }

        .status-bar {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .status-badge {
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ef4444;
            animation: pulse 2s ease-in-out infinite;
        }

        .status-dot.live {
            background: #10b981;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .quality-badge {
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: 600;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-weight: 600;
            color: #374151;
            font-size: 0.9em;
        }

        .form-group input {
            padding: 12px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #f093fb;
        }

        .button-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        button {
            padding: 14px 28px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            flex: 1;
            min-width: 150px;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-primary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(240, 147, 251, 0.4);
        }

        .btn-danger {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
        }

        .btn-danger:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4);
        }

        .info-panel {
            background: #f9fafb;
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #e5e7eb;
        }

        .info-item:last-child {
            border-bottom: none;
        }

        .info-label {
            font-weight: 600;
            color: #6b7280;
        }

        .info-value {
            color: #111827;
            font-family: monospace;
        }

        .log-console {
            background: #1f2937;
            color: #10b981;
            padding: 15px;
            border-radius: 8px;
            height: 200px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            margin-top: 20px;
        }

        .log-entry {
            margin: 5px 0;
            padding: 3px 0;
        }

        .log-error {
            color: #ef4444;
        }

        .log-success {
            color: #10b981;
        }

        .log-info {
            color: #3b82f6;
        }

        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .alert-error {
            background: #fee2e2;
            color: #991b1b;
            border-left: 4px solid #ef4444;
        }

        .alert-success {
            background: #d1fae5;
            color: #065f46;
            border-left: 4px solid #10b981;
        }

        .alert-info {
            background: #dbeafe;
            color: #1e40af;
            border-left: 4px solid #3b82f6;
        }

        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .loading-overlay.active {
            display: flex;
        }

        .spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📺 WebRTC Viewer</h1>
            <p>Watch live streams in real-time</p>
        </div>

        <div class="content">
            <div id="alertContainer"></div>

            <div class="video-section">
                <div class="loading-overlay" id="loadingOverlay">
                    <div class="spinner"></div>
                </div>
                <div class="status-bar">
                    <div class="status-badge">
                        <span class="status-dot" id="statusDot"></span>
                        <span id="statusText">Not Connected</span>
                    </div>
                    <div class="quality-badge" id="qualityBadge">📶 Connecting...</div>
                </div>
                <video id="remoteVideo" autoplay playsinline controls></video>
            </div>

            <div class="controls">
                <div class="form-group">
                    <label for="streamId">Stream ID</label>
                    <input type="number" id="streamId" placeholder="Enter stream ID to watch">
                </div>

                <div class="form-group">
                    <label for="authToken">Authentication Token (Optional)</label>
                    <input type="text" id="authToken" placeholder="Your JWT token (for private streams)">
                </div>
            </div>

            <div class="button-group">
                <button class="btn-primary" id="joinStreamBtn">▶️ Join Stream</button>
                <button class="btn-danger" id="leaveStreamBtn" disabled>⏹️ Leave Stream</button>
            </div>

            <div class="info-panel">
                <h3 style="margin-bottom: 15px;">Connection Information</h3>
                <div class="info-item">
                    <span class="info-label">Server URL:</span>
                    <span class="info-value" id="serverUrl">ws://localhost:8000</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Connection State:</span>
                    <span class="info-value" id="connectionState">Disconnected</span>
                </div>
                <div class="info-item">
                    <span class="info-label">ICE Connection State:</span>
                    <span class="info-value" id="iceConnectionState">N/A</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Stream ID:</span>
                    <span class="info-value" id="currentStreamId">-</span>
                </div>
            </div>

            <div class="log-console" id="logConsole">
                <div class="log-entry log-info">Console initialized. Enter stream ID to start watching...</div>
            </div>
        </div>
    </div>

    <script>
        // Configuration
        const WS_BASE_URL = 'ws://localhost:8000';
        const API_BASE_URL = 'http://localhost:8000';

        // WebRTC configuration
        const rtcConfig = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        };

        // State
        let websocket = null;
        let peerConnection = null;
        let currentStreamId = null;

        // DOM Elements
        const remoteVideo = document.getElementById('remoteVideo');
        const streamIdInput = document.getElementById('streamId');
        const authTokenInput = document.getElementById('authToken');
        const joinStreamBtn = document.getElementById('joinStreamBtn');
        const leaveStreamBtn = document.getElementById('leaveStreamBtn');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const qualityBadge = document.getElementById('qualityBadge');
        const connectionState = document.getElementById('connectionState');
        const iceConnectionState = document.getElementById('iceConnectionState');
        const currentStreamIdEl = document.getElementById('currentStreamId');
        const logConsole = document.getElementById('logConsole');
        const alertContainer = document.getElementById('alertContainer');
        const loadingOverlay = document.getElementById('loadingOverlay');

        // Logging
        function log(message, type = 'info') {
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logConsole.appendChild(entry);
            logConsole.scrollTop = logConsole.scrollHeight;
            console.log(message);
        }

        function showAlert(message, type = 'info') {
            const alert = document.createElement('div');
            alert.className = `alert alert-${type}`;
            alert.textContent = message;
            alertContainer.appendChild(alert);
            setTimeout(() => alert.remove(), 5000);
        }

        // Connect to stream
        async function joinStream() {
            const streamId = streamIdInput.value.trim();
            const token = authTokenInput.value.trim() || '';

            if (!streamId) {
                showAlert('Please enter a stream ID', 'error');
                return;
            }

            currentStreamId = streamId;
            currentStreamIdEl.textContent = streamId;
            loadingOverlay.classList.add('active');

            const wsUrl = token 
                ? `${WS_BASE_URL}/api/webrtc/ws/view/${streamId}?token=${token}`
                : `${WS_BASE_URL}/api/webrtc/ws/view/${streamId}`;

            log(`Connecting to stream ${streamId}...`, 'info');

            websocket = new WebSocket(wsUrl);

            websocket.onopen = async () => {
                log('WebSocket connected!', 'success');
                updateConnectionState('Connected');
                await initializePeerConnection();
            };

            websocket.onmessage = async (event) => {
                const data = JSON.parse(event.data);
                await handleSignal(data);
            };

            websocket.onerror = (error) => {
                log(`WebSocket error: ${error}`, 'error');
                showAlert('Connection error occurred', 'error');
                loadingOverlay.classList.remove('active');
            };

            websocket.onclose = (event) => {
                log(`WebSocket closed: ${event.code} - ${event.reason}`, 'info');
                updateStatus('Disconnected', false);
                updateConnectionState('Disconnected');
                showAlert('Disconnected from stream', 'info');
                cleanup();
            };
        }

        // Initialize peer connection
        async function initializePeerConnection() {
            log('Creating peer connection...', 'info');
            
            peerConnection = new RTCPeerConnection(rtcConfig);

            // Handle incoming tracks
            peerConnection.ontrack = (event) => {
                log('Received remote track!', 'success');
                remoteVideo.srcObject = event.streams[0];
                loadingOverlay.classList.remove('active');
                updateStatus('Live', true);
                showAlert('Stream started! Enjoy watching!', 'success');
            };

            // Handle ICE candidates
            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    websocket.send(JSON.stringify({
                        type: 'ice_candidate',
                        candidate: event.candidate.candidate,
                        sdpMLineIndex: event.candidate.sdpMLineIndex,
                        sdpMid: event.candidate.sdpMid
                    }));
                }
            };

            // Monitor connection state
            peerConnection.onconnectionstatechange = () => {
                log(`Connection state: ${peerConnection.connectionState}`, 'info');
                updateConnectionState(peerConnection.connectionState);
            };

            peerConnection.oniceconnectionstatechange = () => {
                log(`ICE connection state: ${peerConnection.iceConnectionState}`, 'info');
                updateIceConnectionState(peerConnection.iceConnectionState);
                
                if (peerConnection.iceConnectionState === 'connected') {
                    qualityBadge.textContent = '📶 Connected';
                    showAlert('Connection established!', 'success');
                } else if (peerConnection.iceConnectionState === 'failed') {
                    qualityBadge.textContent = '📶 Connection Failed';
                    showAlert('Connection failed. Please try again.', 'error');
                }
            };

            // Create and send offer
            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);

            websocket.send(JSON.stringify({
                type: 'offer',
                sdp: offer.sdp
            }));

            log('Sent offer to broadcaster', 'success');
        }

        // Handle incoming signals
        async function handleSignal(data) {
            const { type } = data;

            log(`Received signal: ${type}`, 'info');

            switch (type) {
                case 'connected':
                    log(`Connected as viewer. Viewer count: ${data.viewer_count}`, 'success');
                    break;

                case 'answer':
                    await handleAnswer(data);
                    break;

                case 'ice_candidate':
                    await handleIceCandidate(data);
                    break;

                case 'broadcaster_disconnected':
                    log('Broadcaster has disconnected', 'error');
                    showAlert('Stream has ended', 'info');
                    leaveStream();
                    break;

                case 'broadcaster_ready':
                    log('Broadcaster is ready', 'success');
                    break;

                case 'error':
                    log(`Server error: ${data.message}`, 'error');
                    showAlert(data.message, 'error');
                    loadingOverlay.classList.remove('active');
                    break;

                case 'pong':
                    // Keep-alive response
                    break;

                default:
                    log(`Unknown signal type: ${type}`, 'info');
            }
        }

        // Handle answer from broadcaster
        async function handleAnswer(data) {
            const { sdp } = data;
            
            if (peerConnection) {
                await peerConnection.setRemoteDescription(
                    new RTCSessionDescription({ type: 'answer', sdp })
                );
                log('Remote description set successfully', 'success');
            }
        }

        // Handle ICE candidate
        async function handleIceCandidate(data) {
            const { candidate, sdpMLineIndex, sdpMid } = data;

            if (peerConnection) {
                await peerConnection.addIceCandidate(
                    new RTCIceCandidate({ candidate, sdpMLineIndex, sdpMid })
                );
                log('Added ICE candidate', 'info');
            }
        }

        // Leave stream
        function leaveStream() {
            log('Leaving stream...', 'info');

            if (websocket) {
                websocket.close();
            }

            cleanup();
            updateStatus('Disconnected', false);
            showAlert('Left the stream', 'info');
        }

        // Cleanup
        function cleanup() {
            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }

            if (remoteVideo.srcObject) {
                remoteVideo.srcObject.getTracks().forEach(track => track.stop());
                remoteVideo.srcObject = null;
            }

            websocket = null;
            currentStreamId = null;
            currentStreamIdEl.textContent = '-';
            loadingOverlay.classList.remove('active');
            
            joinStreamBtn.disabled = false;
            leaveStreamBtn.disabled = true;
            
            updateConnectionState('Disconnected');
            updateIceConnectionState('N/A');
            qualityBadge.textContent = '📶 Disconnected';
        }

        // UI Updates
        function updateStatus(text, isLive) {
            statusText.textContent = text;
            if (isLive) {
                statusDot.classList.add('live');
            } else {
                statusDot.classList.remove('live');
            }
        }

        function updateConnectionState(state) {
            connectionState.textContent = state;
        }

        function updateIceConnectionState(state) {
            iceConnectionState.textContent = state;
        }

        // Event Listeners
        joinStreamBtn.addEventListener('click', () => {
            joinStream();
            joinStreamBtn.disabled = true;
            leaveStreamBtn.disabled = false;
        });

        leaveStreamBtn.addEventListener('click', leaveStream);

        // Keep-alive ping every 30 seconds
        setInterval(() => {
            if (websocket && websocket.readyState === WebSocket.OPEN) {
                websocket.send(JSON.stringify({ type: 'ping' }));
            }
        }, 30000);

        log('Viewer ready. Enter stream ID to watch.', 'success');
    </script>
</body>
</html>
