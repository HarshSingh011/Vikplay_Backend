<!DOCTYPE html>
<html>
<head>
    <title>WebRTC Broadcaster - With JWT Auth</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            max-width: 900px; 
            margin: 50px auto; 
            padding: 20px; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        h1 { color: #333; margin-top: 0; }
        .auth-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        input[type="text"], input[type="number"], input[type="password"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            box-sizing: border-box;
        }
        video { 
            width: 100%; 
            max-width: 640px; 
            background: #000; 
            border-radius: 8px;
            margin: 20px 0;
        }
        button { 
            padding: 12px 24px; 
            margin: 10px 5px; 
            font-size: 16px; 
            cursor: pointer; 
            border-radius: 5px;
            border: none;
            transition: all 0.3s;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
        .btn-login { background: #3b82f6; color: white; }
        .btn-start { background: #10b981; color: white; }
        .btn-stop { background: #ef4444; color: white; }
        .status { 
            padding: 15px; 
            margin: 15px 0; 
            border-radius: 5px; 
            font-weight: bold;
            text-align: center;
        }
        .live { background: #d1fae5; color: #065f46; }
        .offline { background: #fee2e2; color: #991b1b; }
        .authenticated { background: #dbeafe; color: #1e40af; }
        #log { 
            background: #1f2937; 
            color: #10b981; 
            padding: 15px; 
            border-radius: 5px; 
            height: 200px; 
            overflow-y: auto; 
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin: 20px 0;
        }
        .stat-card {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
        }
        .stat-label {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }
        /* ---- Live Chat Styles ---- */
        .chat-section {
            margin-top: 20px;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            overflow: hidden;
        }
        .chat-header {
            background: #667eea;
            color: white;
            padding: 12px 16px;
            font-weight: bold;
            font-size: 15px;
        }
        #chatMessages {
            height: 260px;
            overflow-y: auto;
            padding: 12px;
            background: #f9fafb;
        }
        .chat-msg {
            margin-bottom: 8px;
            padding: 6px 10px;
            border-radius: 6px;
            background: #fff;
            box-shadow: 0 1px 2px rgba(0,0,0,0.06);
            word-wrap: break-word;
        }
        .chat-msg .chat-user {
            font-weight: bold;
            color: #667eea;
            margin-right: 6px;
        }
        .chat-msg .chat-time {
            font-size: 11px;
            color: #9ca3af;
            float: right;
        }
        .chat-msg.self {
            background: #eef2ff;
        }
        .chat-msg.broadcaster-msg {
            background: #f0fdf4;
            border-left: 3px solid #10b981;
        }
        .chat-msg.broadcaster-msg .chat-user {
            color: #059669;
        }
        .chat-role-badge {
            display: inline-block;
            font-size: 10px;
            padding: 1px 6px;
            border-radius: 3px;
            margin-right: 4px;
            font-weight: bold;
            vertical-align: middle;
        }
        .badge-broadcaster {
            background: #d1fae5;
            color: #065f46;
        }
        .badge-viewer {
            background: #dbeafe;
            color: #1e40af;
        }
        .chat-input-row {
            display: flex;
            border-top: 1px solid #e5e7eb;
        }
        .chat-input-row input {
            flex: 1;
            border: none;
            padding: 12px;
            font-size: 14px;
            outline: none;
        }
        .chat-input-row button {
            margin: 0;
            border-radius: 0;
            padding: 12px 20px;
            background: #667eea;
            color: white;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎥 WebRTC Broadcaster (JWT Auth)</h1>
        
        <!-- Authentication Section -->
        <div class="auth-section" id="authSection">
            <h3>🔐 Authentication</h3>
            <div class="form-group">
                <label>Email:</label>
                <input type="text" id="email" placeholder="your@email.com">
            </div>
            <div class="form-group">
                <label>Password:</label>
                <input type="password" id="password" placeholder="Your password">
            </div>
            <button class="btn-login" onclick="login()">🔑 Login</button>
            
            <div style="margin-top: 10px;">
                <small>Or paste JWT token directly:</small>
                <input type="text" id="jwtToken" placeholder="Paste JWT token here">
            </div>
        </div>

        <div id="authStatus" class="status offline" style="display:none;">Not Authenticated</div>
        
        <!-- Streaming Controls -->
        <div id="streamingSection" style="display:none;">
            <div class="form-group">
                <label>Stream ID:</label>
                <input type="number" id="streamId" value="1">
            </div>
            
            <div id="streamStatus" class="status offline">⚫ Not Streaming</div>
            
            <video id="localVideo" autoplay muted playsinline></video>
            
            <div>
                <button class="btn-start" onclick="startStream()">▶️ Start Broadcasting</button>
                <button class="btn-stop" onclick="stopStream()">⏹️ Stop Broadcasting</button>
            </div>
            
            <div class="stats">
                <div class="stat-card">
                    <div class="stat-value" id="viewers">0</div>
                    <div class="stat-label">VIEWERS</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="connections">0</div>
                    <div class="stat-label">CONNECTIONS</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="uptime">00:00</div>
                    <div class="stat-label">UPTIME</div>
                </div>
            </div>
        </div>

        <!-- Live Chat Section -->
        <div class="chat-section" id="chatSection" style="display:none;">
            <div class="chat-header">💬 Live Chat</div>
            <div id="chatMessages"></div>
            <div class="chat-input-row">
                <input type="text" id="chatInput" placeholder="Type a message..." onkeydown="if(event.key==='Enter') sendChat()">
                <button onclick="sendChat()">Send</button>
            </div>
        </div>
        
        <h3>📊 Console:</h3>
        <div id="log"></div>
    </div>

    <script>
        // Production API URLs - change to localhost for local development
        const API_URL = 'https://vikplay-backend.onrender.com';
        const WS_URL = 'wss://vikplay-backend.onrender.com';
        
        let jwtToken = null;
        let currentUser = null;
        let localStream = null;
        let websocket = null;
        let peerConnections = {};
        let streamStartTime = null;
        let uptimeInterval = null;
        let syncInterval = null;
        
        const rtcConfig = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        };
        
        function log(msg, type = 'info') {
            const logDiv = document.getElementById('log');
            const time = new Date().toLocaleTimeString();
            const color = type === 'error' ? '#ef4444' : type === 'success' ? '#10b981' : '#60a5fa';
            logDiv.innerHTML += `<span style="color:${color}">[${time}] ${msg}</span><br>`;
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(msg);
        }
        
        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            if (!email || !password) {
                log('❌ Please enter email and password', 'error');
                return;
            }
            
            try {
                log('🔐 Logging in...');
                
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                
                if (response.ok && data.access_token) {
                    jwtToken = data.access_token;
                    broadcasterUsername = (data.user && data.user.username) ? data.user.username : email.split('@')[0];
                    document.getElementById('jwtToken').value = jwtToken;
                    
                    log('✅ Login successful!', 'success');
                    log(`👤 Logged in as: ${broadcasterUsername}`);
                    
                    // Show authenticated status
                    document.getElementById('authStatus').style.display = 'block';
                    document.getElementById('authStatus').className = 'status authenticated';
                    document.getElementById('authStatus').textContent = `✅ Authenticated as ${email}`;
                    
                    // Show streaming section
                    document.getElementById('streamingSection').style.display = 'block';
                    
                    // Hide auth section
                    document.getElementById('authSection').style.display = 'none';
                } else {
                    log(`❌ Login failed: ${data.detail || data.message || 'Unknown error'}`, 'error');
                }
            } catch (error) {
                log(`❌ Login error: ${error.message}`, 'error');
            }
        }
        
        // Allow using pasted JWT token
        document.getElementById('jwtToken').addEventListener('input', (e) => {
            if (e.target.value.length > 20) {
                jwtToken = e.target.value;
                log('✅ JWT token set from paste', 'success');
                document.getElementById('authStatus').style.display = 'block';
                document.getElementById('authStatus').className = 'status authenticated';
                document.getElementById('authStatus').textContent = '✅ Authenticated with JWT Token';
                document.getElementById('streamingSection').style.display = 'block';
                document.getElementById('authSection').style.display = 'none';
            }
        });
        
        async function startStream() {
            if (!jwtToken) {
                log('❌ Please login first!', 'error');
                return;
            }
            
            const streamId = document.getElementById('streamId').value;
            
            try {
                log('🎥 Getting camera access...');
                localStream = await navigator.mediaDevices.getUserMedia({
                    video: { width: 1280, height: 720 },
                    audio: true
                });
                
                document.getElementById('localVideo').srcObject = localStream;
                log('✅ Camera and microphone access granted!', 'success');
                
                // Connect to WebSocket WITH JWT token
                const wsUrl = `${WS_URL}/api/webrtc/ws/broadcast/${streamId}?token=${jwtToken}`;
                log(`🔌 Connecting to WebSocket...`);
                log(`🔑 Using token: ${jwtToken.substring(0, 50)}...`);
                
                websocket = new WebSocket(wsUrl);
                
                websocket.onopen = () => {
                    log('✅ WebSocket connected! You are LIVE!', 'success');
                    document.getElementById('streamStatus').className = 'status live';
                    document.getElementById('streamStatus').textContent = '🔴 LIVE';
                    document.getElementById('chatSection').style.display = 'block';
                    
                    // Start uptime counter
                    streamStartTime = Date.now();
                    updateUptime();
                    uptimeInterval = setInterval(updateUptime, 1000);

                    // Start sending sync timestamps every 2 seconds
                    syncInterval = setInterval(() => {
                        if (websocket && websocket.readyState === WebSocket.OPEN) {
                            websocket.send(JSON.stringify({
                                type: 'sync_timestamp',
                                broadcaster_ts: Date.now() / 1000
                            }));
                        }
                    }, 2000);
                };
                
                websocket.onmessage = async (event) => {
                    const data = JSON.parse(event.data);
                    await handleSignal(data);
                };
                
                websocket.onerror = (error) => {
                    log(`❌ WebSocket error: ${error}`, 'error');
                };
                
                websocket.onclose = (event) => {
                    log(`🔌 WebSocket closed (Code: ${event.code}, Reason: ${event.reason || 'None'})`);
                    document.getElementById('streamStatus').className = 'status offline';
                    document.getElementById('streamStatus').textContent = '⚫ Not Streaming';
                    
                    if (uptimeInterval) {
                        clearInterval(uptimeInterval);
                        uptimeInterval = null;
                    }
                };
                
            } catch (error) {
                log(`❌ Error: ${error.message}`, 'error');
            }
        }
        
        async function handleSignal(data) {
            log(`📨 Received: ${data.type}`);
            
            if (data.type === 'new_viewer') {
                log(`👤 New viewer connected! ID: ${data.viewer_id}`, 'success');
                await createPeerConnection(data.viewer_id);
                updateStats();
            }
            else if (data.type === 'viewer_left') {
                log(`👋 Viewer left: ${data.viewer_id}`);
                closePeerConnection(data.viewer_id);
                updateStats();
            }
            else if (data.type === 'offer') {
                await handleOffer(data);
            }
            else if (data.type === 'ice_candidate') {
                await handleIceCandidate(data);
            }
            else if (data.type === 'viewer_count') {
                document.getElementById('viewers').textContent = data.count;
            }
            else if (data.type === 'chat_message') {
                appendChat(data.username, data.message, data.timestamp, false, data.role);
            }
            else if (data.type === 'keyframe_request') {
                log(`🔑 Keyframe requested by viewer ${data.viewer_id}`);
                // Force a keyframe by re-encoding — replace video track on the viewer's PC
                const viewerPc = peerConnections[data.viewer_id];
                if (viewerPc && localStream) {
                    const videoSender = viewerPc.getSenders().find(s => s.track && s.track.kind === 'video');
                    if (videoSender) {
                        const params = videoSender.getParameters();
                        if (!params.encodings || params.encodings.length === 0) {
                            params.encodings = [{}];
                        }
                        // Toggle maxBitrate to force keyframe
                        params.encodings[0].maxBitrate = params.encodings[0].maxBitrate ? undefined : 2000000;
                        videoSender.setParameters(params).then(() => {
                            log(`✅ Keyframe sent for viewer ${data.viewer_id}`, 'success');
                        }).catch(err => {
                            log(`⚠️ Keyframe fallback: ${err.message}`);
                        });
                    }
                }
            }
        }
        
        async function createPeerConnection(viewerId) {
            const pc = new RTCPeerConnection(rtcConfig);
            peerConnections[viewerId] = pc;
            
            // Add local stream tracks
            localStream.getTracks().forEach(track => {
                pc.addTrack(track, localStream);
            });
            
            // Handle ICE candidates
            pc.onicecandidate = (event) => {
                if (event.candidate && websocket) {
                    websocket.send(JSON.stringify({
                        type: 'ice_candidate',
                        target: viewerId,  // Server expects 'target', not 'target_id'
                        candidate: event.candidate
                    }));
                }
            };
            
            pc.onconnectionstatechange = () => {
                log(`🔗 Connection state with viewer ${viewerId}: ${pc.connectionState}`);
            };
            
            // Wait for offer from viewer
            log(`⏳ Waiting for offer from viewer ${viewerId}...`);
        }
        
        async function handleOffer(data) {
            const viewerId = data.sender_id;
            const pc = peerConnections[viewerId];
            
            if (!pc) {
                log(`❌ No peer connection for viewer ${viewerId}`, 'error');
                return;
            }
            
            try {
                await pc.setRemoteDescription(data.offer);
                log(`✅ Set remote description for viewer ${viewerId}`);
                
                const answer = await pc.createAnswer();
                await pc.setLocalDescription(answer);
                
                websocket.send(JSON.stringify({
                    type: 'answer',
                    target: viewerId,  // Server expects 'target', not 'target_id'
                    answer: answer
                }));
                
                log(`✅ Sent answer to viewer ${viewerId}`, 'success');
            } catch (error) {
                log(`❌ Error handling offer: ${error.message}`, 'error');
            }
        }
        
        async function handleIceCandidate(data) {
            const viewerId = data.sender_id;
            const pc = peerConnections[viewerId];
            
            if (pc && data.candidate) {
                try {
                    await pc.addIceCandidate(data.candidate);
                    log(`✅ Added ICE candidate for viewer ${viewerId}`);
                } catch (error) {
                    log(`❌ Error adding ICE candidate: ${error.message}`, 'error');
                }
            }
        }
        
        function closePeerConnection(viewerId) {
            if (peerConnections[viewerId]) {
                peerConnections[viewerId].close();
                delete peerConnections[viewerId];
                updateStats();
            }
        }
        
        function updateStats() {
            document.getElementById('connections').textContent = Object.keys(peerConnections).length;
        }
        
        function updateUptime() {
            if (!streamStartTime) return;
            
            const elapsed = Math.floor((Date.now() - streamStartTime) / 1000);
            const minutes = Math.floor(elapsed / 60);
            const seconds = elapsed % 60;
            document.getElementById('uptime').textContent = 
                `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }
        
        function stopStream() {
            if (websocket) {
                websocket.close();
                websocket = null;
            }
            
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }
            
            Object.keys(peerConnections).forEach(closePeerConnection);
            
            if (uptimeInterval) {
                clearInterval(uptimeInterval);
                uptimeInterval = null;
            }
            if (syncInterval) {
                clearInterval(syncInterval);
                syncInterval = null;
            }
            
            document.getElementById('localVideo').srcObject = null;
            document.getElementById('viewers').textContent = '0';
            document.getElementById('connections').textContent = '0';
            document.getElementById('uptime').textContent = '00:00';
            document.getElementById('chatSection').style.display = 'none';
            document.getElementById('chatMessages').innerHTML = '';
            
            log('⏹️ Streaming stopped', 'success');
        }
        
        // ---- Live Chat Functions ----
        let broadcasterUsername = 'Broadcaster';
        
        function sendChat() {
            const input = document.getElementById('chatInput');
            const msg = input.value.trim();
            if (!msg || !websocket || websocket.readyState !== WebSocket.OPEN) return;
            
            websocket.send(JSON.stringify({
                type: 'chat_message',
                username: broadcasterUsername,
                message: msg
            }));
            input.value = '';
        }
        
        function appendChat(username, message, timestamp, isSelf, role) {
            const container = document.getElementById('chatMessages');
            const div = document.createElement('div');
            let cls = 'chat-msg';
            if (isSelf) cls += ' self';
            if (role === 'broadcaster') cls += ' broadcaster-msg';
            div.className = cls;
            const time = timestamp ? new Date(timestamp).toLocaleTimeString() : new Date().toLocaleTimeString();
            const badgeCls = role === 'broadcaster' ? 'badge-broadcaster' : 'badge-viewer';
            const badgeLabel = role === 'broadcaster' ? 'HOST' : escapeHtml(username);
            div.innerHTML = `<span class="chat-time">${time}</span><span class="chat-role-badge ${badgeCls}">${badgeLabel}</span><span class="chat-user">${role === 'broadcaster' ? escapeHtml(username) + ':' : ''}</span> ${escapeHtml(message)}`;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }
        
        function escapeHtml(text) {
            const d = document.createElement('div');
            d.textContent = text;
            return d.innerHTML;
        }
        
        // Initialize
        log('🚀 WebRTC Broadcaster with JWT Authentication ready!');
    </script>
</body>
</html>
