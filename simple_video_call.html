<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Video Call Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 30px;
        }

        .section {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .section h3 {
            margin-bottom: 15px;
            color: #333;
        }

        input, button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }

        button {
            background: #667eea;
            color: white;
            font-weight: 600;
            cursor: pointer;
            border: none;
        }

        button:hover:not(:disabled) {
            background: #5568d3;
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .status {
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
            font-size: 13px;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
        }

        .videos {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        video {
            width: 100%;
            height: 300px;
            background: #000;
            border-radius: 10px;
        }

        .log-console {
            background: #1a1a1a;
            color: #00ff00;
            padding: 15px;
            border-radius: 10px;
            height: 200px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }

        .log-entry {
            margin-bottom: 3px;
        }

        .log-entry.error {
            color: #ff6b6b;
        }

        .log-entry.success {
            color: #51cf66;
        }

        .test-creds {
            background: #fff3cd;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 10px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎥 Simple Video Call Test</h1>

        <!-- Login Section -->
        <div class="section">
            <h3>1. Login First</h3>
            <div class="test-creds">
                <strong>Test Users:</strong> caller@test.com / Test123! | receiver@test.com / Test123!
            </div>
            <input type="email" id="email" placeholder="Email" value="caller@test.com">
            <input type="password" id="password" placeholder="Password" value="Test123!">
            <button onclick="login()">🔐 Login</button>
            <div id="loginStatus"></div>
        </div>

        <!-- Call Section -->
        <div class="section">
            <h3>2. Start Call</h3>
            <button id="startCameraBtn" onclick="startCamera()" disabled>📹 Start Camera</button>
            <div id="cameraStatus"></div>
        </div>

        <!-- Video Section -->
        <div class="videos">
            <div>
                <h4>Your Video</h4>
                <video id="localVideo" autoplay muted playsinline></video>
            </div>
            <div>
                <h4>Remote Video</h4>
                <video id="remoteVideo" autoplay playsinline></video>
            </div>
        </div>

        <!-- Console -->
        <div class="section">
            <h3>Console Log</h3>
            <div class="log-console" id="console"></div>
        </div>
    </div>

    <script>
        let token = null;
        let localStream = null;

        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${timestamp}] ${message}`;
            
            const console = document.getElementById('console');
            console.appendChild(entry);
            console.scrollTop = console.scrollHeight;
        }

        function showStatus(elementId, message, isSuccess) {
            const el = document.getElementById(elementId);
            el.textContent = message;
            el.className = `status ${isSuccess ? 'success' : 'error'}`;
        }

        async function login() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();

            log('🔐 Logging in...', 'info');

            try {
                const response = await fetch('http://localhost:8000/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                if (!response.ok) {
                    const error = await response.json();
                    log(`❌ Login failed: ${error.detail}`, 'error');
                    showStatus('loginStatus', '❌ Login failed: ' + error.detail, false);
                    return;
                }

                const data = await response.json();
                token = data.access_token;

                log('✅ Login successful!', 'success');
                log(`Token: ${token.substring(0, 40)}...`, 'info');
                showStatus('loginStatus', '✅ Login successful!', true);

                // Decode token
                const payload = JSON.parse(atob(token.split('.')[1]));
                log(`User ID: ${payload.user_id}, Email: ${payload.sub}`, 'info');

                // Enable camera button
                document.getElementById('startCameraBtn').disabled = false;

            } catch (error) {
                log(`❌ Error: ${error.message}`, 'error');
                showStatus('loginStatus', '❌ Error: ' + error.message, false);
            }
        }

        async function startCamera() {
            log('📹 Starting camera...', 'info');

            try {
                localStream = await navigator.mediaDevices.getUserMedia({
                    video: { width: 1280, height: 720 },
                    audio: true
                });

                document.getElementById('localVideo').srcObject = localStream;
                
                log('✅ Camera started successfully!', 'success');
                showStatus('cameraStatus', '✅ Camera and microphone active', true);

                log(`Video tracks: ${localStream.getVideoTracks().length}`, 'info');
                log(`Audio tracks: ${localStream.getAudioTracks().length}`, 'info');

            } catch (error) {
                log(`❌ Camera error: ${error.message}`, 'error');
                showStatus('cameraStatus', '❌ Camera error: ' + error.message, false);
            }
        }

        // Initialize
        log('🚀 Simple Video Call Test loaded', 'success');
        log('Step 1: Click Login button', 'info');
        log('Step 2: Click Start Camera button', 'info');
    </script>
</body>
</html>
