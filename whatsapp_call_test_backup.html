<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp-Style Video Call - VikPay</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0b141a;
            color: #e9edef;
            min-height: 100vh;
        }

        .app-container {
            display: grid;
            grid-template-columns: 350px 1fr;
            height: 100vh;
        }

        /* Sidebar - User List */
        .sidebar {
            background: #111b21;
            border-right: 1px solid #2a3942;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            background: #202c33;
            padding: 20px;
            border-bottom: 1px solid #2a3942;
        }

        .sidebar-header h2 {
            color: #e9edef;
            margin-bottom: 10px;
            font-size: 1.3em;
        }

        .auth-input {
            width: 100%;
            padding: 10px;
            background: #2a3942;
            border: 1px solid #3b4a54;
            border-radius: 8px;
            color: #e9edef;
            font-size: 13px;
            margin-bottom: 10px;
        }

        .auth-input::placeholder {
            color: #8696a0;
        }

        .connect-btn {
            width: 100%;
            padding: 12px;
            background: #00a884;
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .connect-btn:hover:not(:disabled) {
            background: #06cf9c;
        }

        .connect-btn:disabled {
            background: #3b4a54;
            cursor: not-allowed;
        }

        .search-box {
            padding: 15px;
            background: #111b21;
            border-bottom: 1px solid #2a3942;
        }

        .search-input {
            width: 100%;
            padding: 10px 15px;
            background: #202c33;
            border: 1px solid #3b4a54;
            border-radius: 8px;
            color: #e9edef;
            font-size: 14px;
        }

        .user-list {
            flex: 1;
            overflow-y: auto;
        }

        .user-item {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            border-bottom: 1px solid #2a3942;
            cursor: pointer;
            transition: background 0.2s;
        }

        .user-item:hover {
            background: #202c33;
        }

        .user-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 20px;
            margin-right: 15px;
        }

        .user-info {
            flex: 1;
        }

        .user-name {
            font-weight: 500;
            margin-bottom: 4px;
        }

        .user-email {
            font-size: 13px;
            color: #8696a0;
        }

        .call-btn {
            background: #00a884;
            border: none;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            cursor: pointer;
            transition: transform 0.2s;
            font-size: 20px;
        }

        .call-btn:hover {
            transform: scale(1.1);
        }

        /* Main Content - Video Area */
        .main-content {
            display: flex;
            flex-direction: column;
            background: #0b141a;
        }

        .video-area {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .video-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        #remoteVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #1f2937;
        }

        #localVideo {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 250px;
            height: 140px;
            border-radius: 10px;
            object-fit: cover;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            border: 2px solid #2a3942;
        }

        .call-controls {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 10;
        }

        .control-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            font-size: 24px;
            transition: all 0.2s;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .control-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
        }

        .btn-end {
            background: #f44336;
            color: white;
        }

        .btn-mute {
            background: #4caf50;
            color: white;
        }

        .btn-video {
            background: #2196f3;
            color: white;
        }

        .status-bar {
            background: #202c33;
            padding: 15px 30px;
            border-top: 1px solid #2a3942;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #8696a0;
        }

        .status-dot.connected {
            background: #00a884;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .idle-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            gap: 20px;
        }

        .idle-icon {
            font-size: 80px;
        }

        .idle-text {
            color: #8696a0;
            font-size: 18px;
        }

        /* Incoming Call Modal */
        .incoming-call-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .incoming-call-modal.show {
            display: flex;
        }

        .incoming-call-content {
            background: #202c33;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            min-width: 400px;
        }

        .caller-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            font-weight: 600;
        }

        .caller-name {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .call-type {
            color: #8696a0;
            margin-bottom: 30px;
        }

        .call-actions {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        .action-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            font-size: 30px;
            transition: transform 0.2s;
        }

        .action-btn:hover {
            transform: scale(1.1);
        }

        .btn-accept {
            background: #00a884;
            color: white;
        }

        .btn-decline {
            background: #f44336;
            color: white;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: #8696a0;
        }

        .loading.show {
            display: block;
        }

        /* Debug Console */
        .debug-console {
            position: fixed;
            bottom: 0;
            right: 0;
            width: 400px;
            height: 300px;
            background: #1a1a1a;
            border: 2px solid #00a884;
            border-radius: 10px 0 0 0;
            display: flex;
            flex-direction: column;
            z-index: 10000;
        }

        .debug-header {
            background: #00a884;
            color: white;
            padding: 10px 15px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .debug-body {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            color: #e9edef;
        }

        .debug-log {
            margin-bottom: 5px;
            padding: 5px;
            border-left: 3px solid #555;
        }

        .debug-log.info {
            border-left-color: #2196f3;
            color: #64b5f6;
        }

        .debug-log.success {
            border-left-color: #4caf50;
            color: #81c784;
        }

        .debug-log.error {
            border-left-color: #f44336;
            color: #e57373;
        }

        .debug-log.warning {
            border-left-color: #ff9800;
            color: #ffb74d;
        }

        .debug-timestamp {
            color: #8696a0;
            font-size: 10px;
        }

        .clear-btn {
            background: transparent;
            border: none;
            color: white;
            cursor: pointer;
            padding: 5px 10px;
        }

        .clear-btn:hover {
            background: rgba(255,255,255,0.1);
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>🎥 Video Calls</h2>
                <textarea class="auth-input" id="jwtToken" placeholder="Paste your JWT token here" rows="3"></textarea>
                <button class="connect-btn" id="connectBtn" onclick="connect()">Connect</button>
                <div id="connectionStatus" style="margin-top: 10px; font-size: 12px; color: #8696a0;"></div>
            </div>

            <div class="search-box">
                <input type="text" class="search-input" id="searchInput" placeholder="Search users..." oninput="searchUsers()">
            </div>

            <div id="loadingUsers" class="loading">Loading users...</div>
            <div class="user-list" id="userList"></div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="video-area">
                <div id="idleScreen" class="idle-screen">
                    <div class="idle-icon">📞</div>
                    <div class="idle-text">Select a user to start a call</div>
                </div>

                <div id="videoContainer" class="video-container" style="display: none;">
                    <video id="remoteVideo" autoplay playsinline></video>
                    <video id="localVideo" autoplay muted playsinline></video>
                    
                    <div class="call-controls">
                        <button class="control-btn btn-video" id="videoBtn" onclick="toggleVideo()" title="Toggle Video">
                            📹
                        </button>
                        <button class="control-btn btn-mute" id="muteBtn" onclick="toggleAudio()" title="Toggle Audio">
                            🎤
                        </button>
                        <button class="control-btn btn-end" onclick="hangup()" title="End Call">
                            📞
                        </button>
                    </div>
                </div>
            </div>

            <div class="status-bar">
                <div class="status-item">
                    <span class="status-dot" id="wsStatusDot"></span>
                    <span id="wsStatus">Not Connected</span>
                </div>
                <div class="status-item" id="callInfo"></div>
            </div>
        </div>
    </div>

    <!-- Incoming Call Modal -->
    <div class="incoming-call-modal" id="incomingCallModal">
        <div class="incoming-call-content">
            <div class="caller-avatar" id="callerAvatar"></div>
            <div class="caller-name" id="callerName"></div>
            <div class="call-type">📹 Video Call</div>
            <div class="call-actions">
                <button class="action-btn btn-decline" onclick="declineCall()">❌</button>
                <button class="action-btn btn-accept" onclick="acceptCall()">✅</button>
            </div>
        </div>
    </div>

    <script>
        let ws = null;
        let localStream = null;
        let peerConnection = null;
        let currentCallId = null;
        let remoteUserId = null;
        let currentUser = null;
        let incomingCallData = null;
        let isVideoEnabled = true;
        let isAudioEnabled = true;

        const config = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        };

        async function connect() {
            const token = document.getElementById('jwtToken').value.trim();
            if (!token) {
                alert('Please enter a JWT token');
                return;
            }

            try {
                // Decode token to get user info
                const payload = JSON.parse(atob(token.split('.')[1]));
                currentUser = {
                    id: payload.user_id,
                    sub: payload.sub
                };

                // Connect WebSocket
                const wsUrl = `ws://localhost:8000/calls/ws?token=${encodeURIComponent(token)}`;
                ws = new WebSocket(wsUrl);

                ws.onopen = () => {
                    debugLog('✅ WebSocket connected successfully!', 'success');
                    document.getElementById('wsStatus').textContent = 'Connected';
                    document.getElementById('wsStatusDot').classList.add('connected');
                    document.getElementById('connectionStatus').textContent = '✅ Connected as ' + payload.sub;
                    document.getElementById('connectBtn').disabled = true;
                    
                    // Load users
                    debugLog('👥 Loading users list...', 'info');
                    loadUsers(token);
                };

                ws.onmessage = async (event) => {
                    const message = JSON.parse(event.data);
                    debugLog(`📨 Received: ${message.type}`, 'info');
                    
                    switch(message.type) {
                        case 'INCOMING_CALL':
                            handleIncomingCall(message.data);
                            break;
                        case 'WEBRTC_OFFER':
                            await handleOffer(message);
                            break;
                        case 'WEBRTC_ANSWER':
                            await handleAnswer(message);
                            break;
                        case 'WEBRTC_ICE_CANDIDATE':
                            await handleIceCandidate(message);
                            break;
                        case 'CALL_ENDED':
                            handleCallEnded();
                            break;
                    }
                };

                ws.onerror = (error) => {
                    debugLog('❌ WebSocket error occurred!', 'error');
                    debugLog('Error details: ' + JSON.stringify(error), 'error');
                    alert('WebSocket connection failed - Check debug console');
                };

                ws.onclose = (event) => {
                    debugLog(`⚠️ WebSocket disconnected - Code: ${event.code}, Reason: ${event.reason || 'No reason provided'}`, 'warning');
                    document.getElementById('wsStatus').textContent = 'Disconnected';
                    document.getElementById('wsStatusDot').classList.remove('connected');
                    document.getElementById('connectBtn').disabled = false;
                    document.getElementById('connectionStatus').textContent = '❌ Disconnected';
                };
            } catch (error) {
                debugLog('❌ Connection failed: ' + error.message, 'error');
                debugLog('Stack trace: ' + error.stack, 'error');
                alert('Failed to connect: ' + error.message);
            }
        }

        async function loadUsers(token) {
            const loadingEl = document.getElementById('loadingUsers');
            loadingEl.classList.add('show');

            try {
                debugLog('📡 Fetching users from server...', 'info');
                const response = await fetch('http://localhost:8000/calls/users/search', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                debugLog(`Server response status: ${response.status}`, 'info');
                
                if (!response.ok) {
                    const errorText = await response.text();
                    debugLog(`❌ Failed to load users: ${response.status} - ${errorText}`, 'error');
                    throw new Error(`HTTP ${response.status}: ${errorText}`);
                }

                const users = await response.json();
                debugLog(`Received ${users.length} users from server`, 'success');
                displayUsers(users);
            } catch (error) {
                debugLog('❌ Failed to load users: ' + error.message, 'error');
                alert('Failed to load users: ' + error.message);
            } finally {
                loadingEl.classList.remove('show');
            }
        }

        function displayUsers(users) {
            const userList = document.getElementById('userList');
            userList.innerHTML = '';

            debugLog(`✅ Displaying ${users.length} users`, 'success');

            if (users.length === 0) {
                userList.innerHTML = '<div style="padding: 20px; text-align: center; color: #8696a0;">No users found</div>';
                return;
            }

            users.forEach(user => {
                const userItem = document.createElement('div');
                userItem.className = 'user-item';
                userItem.innerHTML = `
                    <div class="user-avatar">${user.username.charAt(0).toUpperCase()}</div>
                    <div class="user-info">
                        <div class="user-name">${user.username} <span style="color: #8696a0; font-size: 11px;">(ID: ${user.id})</span></div>
                        <div class="user-email">${user.email || user.phone_number || ''}</div>
                    </div>
                    <button class="call-btn" onclick="callUser('${user.id}', '${user.username}')">📞</button>
                `;
                userList.appendChild(userItem);
                debugLog(`Added user: ${user.username} (ID: ${user.id})`, 'info');
            });
        }

        async function searchUsers() {
            const query = document.getElementById('searchInput').value;
            const token = document.getElementById('jwtToken').value.trim();
            
            if (!token) return;

            try {
                const response = await fetch(`http://localhost:8000/calls/users/search?query=${encodeURIComponent(query)}`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                const users = await response.json();
                displayUsers(users);
            } catch (error) {
                console.error('Search failed:', error);
            }
        }

        async function callUser(userId, username) {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                alert('Please connect first');
                return;
            }

            const token = document.getElementById('jwtToken').value.trim();
            remoteUserId = userId;

            try {
                // Create call via API
                const response = await fetch(`http://localhost:8000/calls/call-user/${userId}`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                const callData = await response.json();
                currentCallId = callData.id;

                // Start local video
                await startLocalVideo();

                // Show video container
                document.getElementById('idleScreen').style.display = 'none';
                document.getElementById('videoContainer').style.display = 'block';
                document.getElementById('callInfo').textContent = `Calling ${username}...`;

                // Initiate WebRTC
                await initiateCall();
            } catch (error) {
                console.error('Failed to call user:', error);
                alert('Failed to initiate call');
            }
        }

        function handleIncomingCall(data) {
            incomingCallData = data;
            document.getElementById('callerName').textContent = data.from_username;
            document.getElementById('callerAvatar').textContent = data.from_username.charAt(0).toUpperCase();
            document.getElementById('incomingCallModal').classList.add('show');
        }

        async function acceptCall() {
            document.getElementById('incomingCallModal').classList.remove('show');
            
            currentCallId = incomingCallData.call_id;
            remoteUserId = incomingCallData.from_user_id;

            // Start local video
            await startLocalVideo();

            // Show video container
            document.getElementById('idleScreen').style.display = 'none';
            document.getElementById('videoContainer').style.display = 'block';
            document.getElementById('callInfo').textContent = `In call with ${incomingCallData.from_username}`;

            // Wait for offer from caller
        }

        function declineCall() {
            document.getElementById('incomingCallModal').classList.remove('show');
            incomingCallData = null;
        }

        async function startLocalVideo() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({
                    video: { width: 1280, height: 720 },
                    audio: true
                });

                document.getElementById('localVideo').srcObject = localStream;
                console.log('Local video started');
            } catch (error) {
                console.error('Camera error:', error);
                alert('Failed to access camera/microphone');
            }
        }

        async function initiateCall() {
            peerConnection = new RTCPeerConnection(config);
            
            // Add local tracks
            localStream.getTracks().forEach(track => {
                peerConnection.addTrack(track, localStream);
            });

            // Handle ICE candidates
            peerConnection.onicecandidate = (event) => {
                if (event.candidate && ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({
                        type: 'WEBRTC_ICE_CANDIDATE',
                        data: {
                            to_user_id: remoteUserId,
                            candidate: event.candidate
                        }
                    }));
                }
            };

            // Handle remote stream
            peerConnection.ontrack = (event) => {
                console.log('Received remote stream');
                document.getElementById('remoteVideo').srcObject = event.streams[0];
                document.getElementById('callInfo').textContent = 'Connected';
            };

            // Create and send offer
            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);

            ws.send(JSON.stringify({
                type: 'WEBRTC_OFFER',
                data: {
                    to_user_id: remoteUserId,
                    offer: offer
                }
            }));
        }

        async function handleOffer(message) {
            if (!localStream) {
                await startLocalVideo();
            }

            peerConnection = new RTCPeerConnection(config);
            
            localStream.getTracks().forEach(track => {
                peerConnection.addTrack(track, localStream);
            });

            peerConnection.onicecandidate = (event) => {
                if (event.candidate && ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({
                        type: 'WEBRTC_ICE_CANDIDATE',
                        data: {
                            to_user_id: message.from_user_id,
                            candidate: event.candidate
                        }
                    }));
                }
            };

            peerConnection.ontrack = (event) => {
                console.log('Received remote stream');
                document.getElementById('remoteVideo').srcObject = event.streams[0];
                document.getElementById('callInfo').textContent = 'Connected';
            };

            await peerConnection.setRemoteDescription(new RTCSessionDescription(message.data));
            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);

            ws.send(JSON.stringify({
                type: 'WEBRTC_ANSWER',
                data: {
                    to_user_id: message.from_user_id,
                    answer: answer
                }
            }));
        }

        async function handleAnswer(message) {
            await peerConnection.setRemoteDescription(new RTCSessionDescription(message.data));
            console.log('Call connected');
        }

        async function handleIceCandidate(message) {
            if (peerConnection) {
                await peerConnection.addIceCandidate(new RTCIceCandidate(message.data.candidate));
            }
        }

        function toggleVideo() {
            if (localStream) {
                const videoTrack = localStream.getVideoTracks()[0];
                videoTrack.enabled = !videoTrack.enabled;
                isVideoEnabled = videoTrack.enabled;
                document.getElementById('videoBtn').textContent = isVideoEnabled ? '📹' : '📹❌';
            }
        }

        function toggleAudio() {
            if (localStream) {
                const audioTrack = localStream.getAudioTracks()[0];
                audioTrack.enabled = !audioTrack.enabled;
                isAudioEnabled = audioTrack.enabled;
                document.getElementById('muteBtn').textContent = isAudioEnabled ? '🎤' : '🎤❌';
            }
        }

        function hangup() {
            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }

            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }

            document.getElementById('localVideo').srcObject = null;
            document.getElementById('remoteVideo').srcObject = null;
            document.getElementById('videoContainer').style.display = 'none';
            document.getElementById('idleScreen').style.display = 'flex';
            document.getElementById('callInfo').textContent = '';

            currentCallId = null;
            remoteUserId = null;
        }

        function handleCallEnded() {
            hangup();
            alert('Call ended');
        }

        // Debug Console Functions
        function debugLog(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const logDiv = document.createElement('div');
            logDiv.className = `debug-log ${type}`;
            logDiv.innerHTML = `<span class="debug-timestamp">[${timestamp}]</span> ${message}`;
            
            const debugBody = document.getElementById('debugBody');
            debugBody.appendChild(logDiv);
            debugBody.scrollTop = debugBody.scrollHeight;
            
            // Also log to console
            console.log(`[${type.toUpperCase()}] ${message}`);
        }

        function clearDebugLog() {
            document.getElementById('debugBody').innerHTML = '';
        }

        // Override console methods
        const originalLog = console.log;
        const originalError = console.error;
        const originalWarn = console.warn;

        console.log = function(...args) {
            originalLog.apply(console, args);
            debugLog(args.join(' '), 'info');
        };

        console.error = function(...args) {
            originalError.apply(console, args);
            debugLog(args.join(' '), 'error');
        };

        console.warn = function(...args) {
            originalWarn.apply(console, args);
            debugLog(args.join(' '), 'warning');
        };

        // Log on page load
        window.addEventListener('DOMContentLoaded', () => {
            debugLog('WhatsApp Call Interface Loaded', 'success');
            debugLog('Waiting for JWT token and connection...', 'info');
        });
    </script>

    <!-- Debug Console -->
    <div class="debug-console">
        <div class="debug-header">
            <span>🔍 Debug Console</span>
            <button class="clear-btn" onclick="clearDebugLog()">Clear</button>
        </div>
        <div class="debug-body" id="debugBody"></div>
    </div>
</body>
</html>
