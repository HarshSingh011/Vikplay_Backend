<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VikPay Video Call Client</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ccc;
        }

        .status-dot.connected {
            background: #10b981;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .panel {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .panel h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 18px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-size: 14px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            margin-right: 10px;
            margin-bottom: 10px;
        }

        button:hover {
            background: #5568d3;
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        button.danger {
            background: #ef4444;
        }

        button.danger:hover {
            background: #dc2626;
        }

        button.success {
            background: #10b981;
        }

        button.success:hover {
            background: #059669;
        }

        .video-container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .videos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 15px;
        }

        .video-wrapper {
            position: relative;
            background: #000;
            border-radius: 5px;
            overflow: hidden;
        }

        video {
            width: 100%;
            height: auto;
            display: block;
        }

        .video-label {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 5px 10px;
            border-radius: 3px;
            font-size: 12px;
        }

        .log {
            background: #1f2937;
            color: #10b981;
            padding: 15px;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 200px;
            overflow-y: auto;
            margin-top: 15px;
        }

        .log-entry {
            margin-bottom: 5px;
        }

        .log-entry.error {
            color: #ef4444;
        }

        .log-entry.info {
            color: #60a5fa;
        }

        .participants {
            list-style: none;
            padding: 0;
        }

        .participant {
            background: #f3f4f6;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .participant-info {
            flex: 1;
        }

        .participant-name {
            font-weight: 600;
            color: #333;
        }

        .participant-status {
            font-size: 12px;
            color: #666;
        }

        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 3px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .badge.joined {
            background: #d1fae5;
            color: #065f46;
        }

        .badge.invited {
            background: #fef3c7;
            color: #92400e;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎥 VikPay Video Call</h1>
            <div class="status">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">Disconnected</span>
            </div>
        </div>

        <div class="grid">
            <div class="panel">
                <h2>🔐 Authentication</h2>
                <div class="form-group">
                    <label>JWT Token</label>
                    <input type="text" id="jwtToken" placeholder="Enter your JWT token">
                </div>
                <button onclick="connectWebSocket()">Connect</button>
                <button class="danger" onclick="disconnectWebSocket()">Disconnect</button>
            </div>

            <div class="panel">
                <h2>📞 Start Call</h2>
                <div class="form-group">
                    <label>Phone Numbers (comma-separated)</label>
                    <input type="text" id="phoneNumbers" placeholder="+1234567890, +0987654321">
                </div>
                <div class="form-group">
                    <label>
                        <input type="checkbox" id="isGroupCall">
                        Group Call
                    </label>
                </div>
                <button class="success" onclick="createCall()">Start Call</button>
            </div>
        </div>

        <div class="grid">
            <div class="panel">
                <h2>👥 Active Calls</h2>
                <div id="activeCalls">
                    <p style="color: #999;">No active calls</p>
                </div>
            </div>

            <div class="panel">
                <h2>➕ Add Participants</h2>
                <div class="form-group">
                    <label>Call ID</label>
                    <input type="text" id="inviteCallId" placeholder="Enter call ID">
                </div>
                <div class="form-group">
                    <label>Phone Numbers (comma-separated)</label>
                    <input type="text" id="invitePhoneNumbers" placeholder="+1111111111">
                </div>
                <button onclick="inviteParticipants()">Invite</button>
            </div>
        </div>

        <div class="video-container">
            <h2 style="margin-bottom: 15px;">📹 Video Streams</h2>
            <div class="videos" id="videoContainer">
                <div class="video-wrapper">
                    <video id="localVideo" autoplay muted playsinline></video>
                    <div class="video-label">You (Local)</div>
                </div>
            </div>
        </div>

        <div class="panel" style="margin-top: 20px;">
            <h2>📊 Logs</h2>
            <div class="log" id="logContainer"></div>
        </div>
    </div>

    <script>
        let ws = null;
        let currentCallId = null;
        let localStream = null;
        let peerConnections = {}; // Map of user_id -> RTCPeerConnection
        const API_BASE = 'http://localhost:8000';
        const WS_BASE = 'ws://localhost:8000';

        const iceServers = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        };

        function log(message, type = 'info') {
            const logContainer = document.getElementById('logContainer');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logContainer.appendChild(entry);
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        function updateStatus(connected) {
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');
            
            if (connected) {
                dot.classList.add('connected');
                text.textContent = 'Connected';
            } else {
                dot.classList.remove('connected');
                text.textContent = 'Disconnected';
            }
        }

        async function connectWebSocket() {
            const token = document.getElementById('jwtToken').value;
            
            if (!token) {
                log('Please enter JWT token', 'error');
                return;
            }

            try {
                ws = new WebSocket(`${WS_BASE}/calls/ws?token=${token}`);
                
                ws.onopen = () => {
                    log('WebSocket connected');
                    updateStatus(true);
                };

                ws.onmessage = async (event) => {
                    const message = JSON.parse(event.data);
                    log(`Received: ${message.type}`);
                    await handleWebSocketMessage(message);
                };

                ws.onerror = (error) => {
                    log(`WebSocket error: ${error}`, 'error');
                };

                ws.onclose = () => {
                    log('WebSocket disconnected');
                    updateStatus(false);
                };
            } catch (error) {
                log(`Connection error: ${error}`, 'error');
            }
        }

        function disconnectWebSocket() {
            if (ws) {
                ws.close();
                ws = null;
            }
        }

        async function handleWebSocketMessage(message) {
            switch (message.type) {
                case 'call_initiated':
                    log(`Incoming call from ${message.data.caller_info.full_name}`);
                    // Handle incoming call
                    break;

                case 'participant_joined':
                    log(`${message.data.user_info.full_name} joined the call`);
                    await createPeerConnection(message.data.user_id, message.data.user_info);
                    break;

                case 'participant_left':
                    log(`User ${message.data.user_id} left the call`);
                    closePeerConnection(message.data.user_id);
                    break;

                case 'call_ended':
                    log('Call ended');
                    endAllConnections();
                    break;

                case 'webrtc_offer':
                    await handleWebRTCOffer(message);
                    break;

                case 'webrtc_answer':
                    await handleWebRTCAnswer(message);
                    break;

                case 'webrtc_ice_candidate':
                    await handleICECandidate(message);
                    break;
            }
        }

        async function createCall() {
            const token = document.getElementById('jwtToken').value;
            const phoneNumbers = document.getElementById('phoneNumbers').value
                .split(',')
                .map(p => p.trim())
                .filter(p => p);
            const isGroupCall = document.getElementById('isGroupCall').checked;

            if (!phoneNumbers.length) {
                log('Please enter at least one phone number', 'error');
                return;
            }

            try {
                // Get local media stream
                localStream = await navigator.mediaDevices.getUserMedia({
                    video: true,
                    audio: true
                });

                document.getElementById('localVideo').srcObject = localStream;
                log('Local media stream acquired');

                // Create call
                const response = await fetch(`${API_BASE}/calls/`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        phone_numbers: phoneNumbers,
                        is_group_call: isGroupCall
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const call = await response.json();
                currentCallId = call.id;
                log(`Call created: ${call.id}`);
                
                // Join the call
                await joinCall(call.id);
                
                displayActiveCalls();
            } catch (error) {
                log(`Error creating call: ${error}`, 'error');
            }
        }

        async function joinCall(callId) {
            const token = document.getElementById('jwtToken').value;
            const peerId = `peer-${Date.now()}`;

            try {
                const response = await fetch(`${API_BASE}/calls/join`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        call_id: callId,
                        peer_id: peerId
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                log(`Joined call: ${callId}`);
            } catch (error) {
                log(`Error joining call: ${error}`, 'error');
            }
        }

        async function createPeerConnection(userId, userInfo) {
            const pc = new RTCPeerConnection(iceServers);
            peerConnections[userId] = pc;

            // Add local stream tracks
            if (localStream) {
                localStream.getTracks().forEach(track => {
                    pc.addTrack(track, localStream);
                });
            }

            // Handle remote stream
            pc.ontrack = (event) => {
                log(`Received remote track from ${userId}`);
                addRemoteVideo(userId, event.streams[0], userInfo);
            };

            // Handle ICE candidates
            pc.onicecandidate = (event) => {
                if (event.candidate && ws) {
                    ws.send(JSON.stringify({
                        type: 'webrtc_ice_candidate',
                        data: {
                            to_user_id: userId,
                            candidate: event.candidate
                        }
                    }));
                }
            };

            // Create and send offer
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);

            if (ws) {
                ws.send(JSON.stringify({
                    type: 'webrtc_offer',
                    data: {
                        to_user_id: userId,
                        offer: offer
                    }
                }));
            }

            log(`Sent offer to ${userId}`);
        }

        async function handleWebRTCOffer(message) {
            const userId = message.from_user_id;
            const offer = message.data;

            const pc = new RTCPeerConnection(iceServers);
            peerConnections[userId] = pc;

            // Add local stream tracks
            if (localStream) {
                localStream.getTracks().forEach(track => {
                    pc.addTrack(track, localStream);
                });
            }

            // Handle remote stream
            pc.ontrack = (event) => {
                log(`Received remote track from ${userId}`);
                addRemoteVideo(userId, event.streams[0], { user_id: userId });
            };

            // Handle ICE candidates
            pc.onicecandidate = (event) => {
                if (event.candidate && ws) {
                    ws.send(JSON.stringify({
                        type: 'webrtc_ice_candidate',
                        data: {
                            to_user_id: userId,
                            candidate: event.candidate
                        }
                    }));
                }
            };

            await pc.setRemoteDescription(offer);
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);

            if (ws) {
                ws.send(JSON.stringify({
                    type: 'webrtc_answer',
                    data: {
                        to_user_id: userId,
                        answer: answer
                    }
                }));
            }

            log(`Sent answer to ${userId}`);
        }

        async function handleWebRTCAnswer(message) {
            const userId = message.from_user_id;
            const answer = message.data;

            const pc = peerConnections[userId];
            if (pc) {
                await pc.setRemoteDescription(answer);
                log(`Set remote description from ${userId}`);
            }
        }

        async function handleICECandidate(message) {
            const userId = message.from_user_id;
            const candidate = message.data;

            const pc = peerConnections[userId];
            if (pc) {
                await pc.addIceCandidate(candidate);
            }
        }

        function addRemoteVideo(userId, stream, userInfo) {
            const videoContainer = document.getElementById('videoContainer');
            
            // Remove existing video if any
            const existingVideo = document.getElementById(`video-${userId}`);
            if (existingVideo) {
                existingVideo.remove();
            }

            const wrapper = document.createElement('div');
            wrapper.className = 'video-wrapper';
            wrapper.id = `video-${userId}`;

            const video = document.createElement('video');
            video.autoplay = true;
            video.playsinline = true;
            video.srcObject = stream;

            const label = document.createElement('div');
            label.className = 'video-label';
            label.textContent = userInfo.full_name || userId;

            wrapper.appendChild(video);
            wrapper.appendChild(label);
            videoContainer.appendChild(wrapper);
        }

        function closePeerConnection(userId) {
            const pc = peerConnections[userId];
            if (pc) {
                pc.close();
                delete peerConnections[userId];
            }

            const videoElement = document.getElementById(`video-${userId}`);
            if (videoElement) {
                videoElement.remove();
            }
        }

        function endAllConnections() {
            Object.keys(peerConnections).forEach(userId => {
                closePeerConnection(userId);
            });

            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }

            currentCallId = null;
        }

        async function inviteParticipants() {
            const token = document.getElementById('jwtToken').value;
            const callId = document.getElementById('inviteCallId').value;
            const phoneNumbers = document.getElementById('invitePhoneNumbers').value
                .split(',')
                .map(p => p.trim())
                .filter(p => p);

            if (!callId || !phoneNumbers.length) {
                log('Please enter call ID and phone numbers', 'error');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/calls/invite`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        call_id: callId,
                        phone_numbers: phoneNumbers
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                log('Participants invited');
            } catch (error) {
                log(`Error inviting participants: ${error}`, 'error');
            }
        }

        async function displayActiveCalls() {
            const token = document.getElementById('jwtToken').value;
            
            try {
                const response = await fetch(`${API_BASE}/calls/`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const calls = await response.json();
                const container = document.getElementById('activeCalls');
                
                if (calls.length === 0) {
                    container.innerHTML = '<p style="color: #999;">No active calls</p>';
                    return;
                }

                container.innerHTML = calls.map(call => `
                    <div class="participant" style="margin-bottom: 10px;">
                        <div class="participant-info">
                            <div class="participant-name">Call ${call.id.substring(0, 8)}...</div>
                            <div class="participant-status">
                                ${call.participants.length} participants | ${call.status}
                            </div>
                        </div>
                        <button class="danger" onclick="leaveCall('${call.id}')">Leave</button>
                    </div>
                `).join('');
            } catch (error) {
                log(`Error fetching active calls: ${error}`, 'error');
            }
        }

        async function leaveCall(callId) {
            const token = document.getElementById('jwtToken').value;

            try {
                const response = await fetch(`${API_BASE}/calls/leave`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        call_id: callId
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                log(`Left call: ${callId}`);
                endAllConnections();
                displayActiveCalls();
            } catch (error) {
                log(`Error leaving call: ${error}`, 'error');
            }
        }

        // Initialize
        log('Video call client initialized');
    </script>
</body>
</html>
