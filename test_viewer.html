<!DOCTYPE html>
<html>
<head>
    <title>WebRTC Test - Viewer</title>
    <style>
        body { font-family: Arial; max-width: 800px; margin: 50px auto; padding: 20px; }
        video { width: 100%; max-width: 640px; background: #000; border-radius: 8px; }
        button { padding: 12px 24px; margin: 10px 5px; font-size: 16px; cursor: pointer; border-radius: 5px; }
        .join { background: #3b82f6; color: white; border: none; }
        .leave { background: #ef4444; color: white; border: none; }
        .status { padding: 15px; margin: 10px 0; border-radius: 5px; font-weight: bold; }
        .watching { background: #dbeafe; color: #1e40af; }
        .offline { background: #fee2e2; color: #991b1b; }
        #log { background: #1f2937; color: #10b981; padding: 15px; border-radius: 5px; height: 200px; overflow-y: auto; font-family: monospace; }
    </style>
</head>
<body>
    <h1>📺 WebRTC Viewer (Test Mode)</h1>
    
    <div>
        <label>Stream ID: <input type="number" id="streamId" value="1" style="padding: 8px; font-size: 16px;"></label>
    </div>
    
    <div id="status" class="status offline">⚫ Not Connected</div>
    
    <video id="remoteVideo" autoplay playsinline controls></video>
    
    <div>
        <button class="join" onclick="joinStream()">▶️ Join Stream</button>
        <button class="leave" onclick="leaveStream()">⏹️ Leave Stream</button>
    </div>
    
    <h3>Console:</h3>
    <div id="log"></div>

    <script>
        const WS_URL = 'ws://localhost:8000';
        let websocket = null;
        let peerConnection = null;
        
        const rtcConfig = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        };
        
        function log(msg) {
            const logDiv = document.getElementById('log');
            const time = new Date().toLocaleTimeString();
            logDiv.innerHTML += `[${time}] ${msg}<br>`;
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(msg);
        }
        
        async function joinStream() {
            const streamId = document.getElementById('streamId').value;
            
            try {
                // Connect to WebSocket (TEST MODE - no token required)
                const wsUrl = `${WS_URL}/api/webrtc/ws/test/view/${streamId}`;
                log(`🔌 Connecting to stream ${streamId}...`);
                
                websocket = new WebSocket(wsUrl);
                
                websocket.onopen = async () => {
                    log('✅ WebSocket connected!');
                    document.getElementById('status').className = 'status watching';
                    document.getElementById('status').textContent = '🟢 Connecting...';
                    await initPeerConnection();
                };
                
                websocket.onmessage = async (event) => {
                    const data = JSON.parse(event.data);
                    await handleSignal(data);
                };
                
                websocket.onerror = (error) => {
                    log(`❌ WebSocket error: ${error}`);
                };
                
                websocket.onclose = () => {
                    log('🔌 WebSocket closed');
                    document.getElementById('status').className = 'status offline';
                    document.getElementById('status').textContent = '⚫ Not Connected';
                };
                
            } catch (error) {
                log(`❌ Error: ${error.message}`);
            }
        }
        
        async function initPeerConnection() {
            log('🤝 Creating peer connection...');
            
            peerConnection = new RTCPeerConnection(rtcConfig);
            
            peerConnection.ontrack = (event) => {
                log('✅ Received video stream!');
                log(`Track kind: ${event.track.kind}, streams: ${event.streams.length}`);
                const remoteVideo = document.getElementById('remoteVideo');
                if (event.streams && event.streams[0]) {
                    remoteVideo.srcObject = event.streams[0];
                    log('📺 Video source set successfully');
                }
                document.getElementById('status').textContent = '🟢 Watching LIVE';
            };
            
            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    log(`📡 Sending ICE candidate`);
                    websocket.send(JSON.stringify({
                        type: 'ice_candidate',
                        candidate: event.candidate.candidate,
                        sdpMLineIndex: event.candidate.sdpMLineIndex,
                        sdpMid: event.candidate.sdpMid
                    }));
                }
            };
            
            peerConnection.oniceconnectionstatechange = () => {
                log(`ICE state: ${peerConnection.iceConnectionState}`);
            };
            
            peerConnection.onconnectionstatechange = () => {
                log(`Connection state: ${peerConnection.connectionState}`);
            };
            
            // Add transceivers to receive video and audio
            peerConnection.addTransceiver('video', { direction: 'recvonly' });
            peerConnection.addTransceiver('audio', { direction: 'recvonly' });
            log('📡 Added transceivers for video and audio');
            
            // Create and send offer
            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);
            
            websocket.send(JSON.stringify({
                type: 'offer',
                sdp: offer.sdp
            }));
            
            log('📤 Sent offer to broadcaster');
        }
        
        async function handleSignal(data) {
            const { type } = data;
            log(`📨 Received: ${type}`);
            
            switch (type) {
                case 'connected':
                    log(`✅ Connected! Viewers: ${data.viewer_count}`);
                    break;
                case 'answer':
                    await handleAnswer(data);
                    break;
                case 'ice_candidate':
                    await handleIceCandidate(data);
                    break;
                case 'broadcaster_disconnected':
                    log('❌ Stream ended by broadcaster');
                    alert('Stream has ended');
                    leaveStream();
                    break;
                case 'error':
                    log(`❌ Error: ${data.message}`);
                    break;
            }
        }
        
        async function handleAnswer(data) {
            const { sdp } = data;
            if (peerConnection) {
                await peerConnection.setRemoteDescription(
                    new RTCSessionDescription({ type: 'answer', sdp })
                );
                log('✅ Set remote description');
            }
        }
        
        async function handleIceCandidate(data) {
            const { candidate, sdpMLineIndex, sdpMid } = data;
            if (peerConnection) {
                await peerConnection.addIceCandidate(
                    new RTCIceCandidate({ candidate, sdpMLineIndex, sdpMid })
                );
            }
        }
        
        function leaveStream() {
            log('⏹️ Leaving stream...');
            
            if (websocket) {
                websocket.close();
            }
            
            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }
            
            const video = document.getElementById('remoteVideo');
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
                video.srcObject = null;
            }
            
            log('✅ Left stream');
        }
        
        log('Ready! Enter stream ID and click "Join Stream"');
    </script>
</body>
</html>
