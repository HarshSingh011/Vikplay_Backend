<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Call Test - VikPay</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .auth-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
        }

        .auth-section h3 {
            color: #333;
            margin-bottom: 15px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 500;
        }

        .input-group input,
        .input-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .input-group input:focus,
        .input-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .input-group textarea {
            min-height: 80px;
            resize: vertical;
            font-family: monospace;
        }

        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-danger {
            background: #e74c3c;
            color: white;
        }

        .btn-danger:hover:not(:disabled) {
            background: #c0392b;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(231, 76, 60, 0.4);
        }

        .btn-success {
            background: #27ae60;
            color: white;
        }

        .btn-success:hover:not(:disabled) {
            background: #229954;
        }

        .video-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .video-container {
            background: #000;
            border-radius: 15px;
            overflow: hidden;
            position: relative;
            aspect-ratio: 16/9;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-label {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
        }

        .status-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .status-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #ddd;
        }

        .status-item:last-child {
            border-bottom: none;
        }

        .status-label {
            color: #666;
            font-weight: 500;
        }

        .status-value {
            color: #333;
            font-weight: 600;
        }

        .status-connected {
            color: #27ae60;
        }

        .status-disconnected {
            color: #e74c3c;
        }

        .logs {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 20px;
            border-radius: 10px;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 13px;
        }

        .log-entry {
            padding: 4px 0;
            border-bottom: 1px solid #333;
        }

        .log-time {
            color: #858585;
            margin-right: 10px;
        }

        .log-info {
            color: #4ec9b0;
        }

        .log-error {
            color: #f48771;
        }

        .log-success {
            color: #89d185;
        }

        @media (max-width: 768px) {
            .video-section {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎥 Video Call Test</h1>
        <p class="subtitle">Test the WebRTC video calling functionality</p>

        <!-- Authentication Section -->
        <div class="auth-section">
            <h3>🔐 Authentication</h3>
            <div class="input-group">
                <label for="jwtToken">JWT Token (from testing):</label>
                <textarea id="jwtToken" placeholder="Paste your JWT token here"></textarea>
            </div>
            <button id="connectBtn" class="btn-primary" onclick="connect()">
                🔌 Connect WebSocket
            </button>
        </div>

        <!-- Video Section -->
        <div class="video-section">
            <div class="video-container">
                <div class="video-label">📹 Local Video</div>
                <video id="localVideo" autoplay muted playsinline></video>
            </div>
            <div class="video-container">
                <div class="video-label">📺 Remote Video</div>
                <video id="remoteVideo" autoplay playsinline></video>
            </div>
        </div>

        <!-- Controls -->
        <div class="button-group">
            <button id="startLocalBtn" class="btn-success" onclick="startLocalVideo()">
                📷 Start Local Camera
            </button>
            <button id="callBtn" class="btn-primary" onclick="makeCall()" disabled>
                📞 Start Call
            </button>
            <button id="hangupBtn" class="btn-danger" onclick="hangup()" disabled>
                🔴 Hang Up
            </button>
        </div>

        <!-- Call Info Input -->
        <div class="auth-section" style="margin-top: 20px;">
            <h3>📱 Call Information</h3>
            <div class="input-group">
                <label for="phoneNumber">Phone Number to Call:</label>
                <input type="text" id="phoneNumber" placeholder="Enter phone number">
            </div>
            <button id="createCallBtn" class="btn-primary" onclick="createCall()">
                📞 Create Call
            </button>
        </div>

        <!-- Status Section -->
        <div class="status-section">
            <h3>📊 Connection Status</h3>
            <div class="status-item">
                <span class="status-label">WebSocket:</span>
                <span id="wsStatus" class="status-value status-disconnected">Disconnected</span>
            </div>
            <div class="status-item">
                <span class="status-label">Local Video:</span>
                <span id="localStatus" class="status-value status-disconnected">Not Started</span>
            </div>
            <div class="status-item">
                <span class="status-label">Call Status:</span>
                <span id="callStatus" class="status-value status-disconnected">Idle</span>
            </div>
            <div class="status-item">
                <span class="status-label">Call ID:</span>
                <span id="callIdDisplay" class="status-value">-</span>
            </div>
        </div>

        <!-- Logs Section -->
        <div class="status-section">
            <h3>📜 Activity Logs</h3>
            <div id="logs" class="logs"></div>
        </div>
    </div>

    <script>
        let ws = null;
        let localStream = null;
        let peerConnection = null;
        let currentCallId = null;
        let remoteUserId = null;

        const config = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        };

        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = document.createElement('div');
            logEntry.className = 'log-entry';
            logEntry.innerHTML = `<span class="log-time">[${timestamp}]</span><span class="log-${type}">${message}</span>`;
            
            const logsContainer = document.getElementById('logs');
            logsContainer.appendChild(logEntry);
            logsContainer.scrollTop = logsContainer.scrollHeight;
            
            console.log(`[${type.toUpperCase()}] ${message}`);
        }

        function updateStatus(element, text, connected = false) {
            const statusElement = document.getElementById(element);
            statusElement.textContent = text;
            statusElement.className = `status-value ${connected ? 'status-connected' : 'status-disconnected'}`;
        }

        async function connect() {
            const token = document.getElementById('jwtToken').value.trim();
            if (!token) {
                alert('Please enter a JWT token');
                return;
            }

            try {
                const wsUrl = `ws://localhost:8000/calls/ws?token=${encodeURIComponent(token)}`;
                ws = new WebSocket(wsUrl);

                ws.onopen = () => {
                    log('WebSocket connected successfully', 'success');
                    updateStatus('wsStatus', 'Connected', true);
                    document.getElementById('connectBtn').disabled = true;
                    document.getElementById('callBtn').disabled = false;
                };

                ws.onmessage = async (event) => {
                    const message = JSON.parse(event.data);
                    log(`Received: ${message.type}`, 'info');
                    
                    switch(message.type) {
                        case 'WEBRTC_OFFER':
                            await handleOffer(message.data);
                            break;
                        case 'WEBRTC_ANSWER':
                            await handleAnswer(message.data);
                            break;
                        case 'WEBRTC_ICE_CANDIDATE':
                            await handleIceCandidate(message.data);
                            break;
                        case 'CALL_INITIATED':
                            handleCallInitiated(message.data);
                            break;
                        case 'CALL_ENDED':
                            handleCallEnded(message.data);
                            break;
                    }
                };

                ws.onerror = (error) => {
                    log(`WebSocket error: ${error.message || 'Unknown error'}`, 'error');
                };

                ws.onclose = () => {
                    log('WebSocket disconnected', 'error');
                    updateStatus('wsStatus', 'Disconnected', false);
                    document.getElementById('connectBtn').disabled = false;
                    document.getElementById('callBtn').disabled = true;
                };
            } catch (error) {
                log(`Connection error: ${error.message}`, 'error');
            }
        }

        async function startLocalVideo() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({
                    video: { width: 1280, height: 720 },
                    audio: true
                });

                document.getElementById('localVideo').srcObject = localStream;
                log('Local camera started successfully', 'success');
                updateStatus('localStatus', 'Active', true);
                document.getElementById('startLocalBtn').disabled = true;
            } catch (error) {
                log(`Camera error: ${error.message}`, 'error');
                alert('Failed to access camera/microphone. Please check permissions.');
            }
        }

        async function createCall() {
            const phoneNumber = document.getElementById('phoneNumber').value.trim();
            if (!phoneNumber) {
                alert('Please enter a phone number');
                return;
            }

            const token = document.getElementById('jwtToken').value.trim();
            if (!token) {
                alert('Please connect first');
                return;
            }

            try {
                const response = await fetch('http://localhost:8000/calls/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        phone_numbers: [phoneNumber],
                        is_group_call: false
                    })
                });

                const data = await response.json();
                
                if (response.ok) {
                    currentCallId = data.id;
                    document.getElementById('callIdDisplay').textContent = currentCallId;
                    log(`Call created: ${currentCallId}`, 'success');
                    updateStatus('callStatus', 'Initiated', true);
                } else {
                    log(`Failed to create call: ${data.detail}`, 'error');
                }
            } catch (error) {
                log(`Create call error: ${error.message}`, 'error');
            }
        }

        async function makeCall() {
            if (!localStream) {
                alert('Please start local camera first');
                return;
            }

            try {
                peerConnection = new RTCPeerConnection(config);
                
                // Add local tracks
                localStream.getTracks().forEach(track => {
                    peerConnection.addTrack(track, localStream);
                });

                // Handle ICE candidates
                peerConnection.onicecandidate = (event) => {
                    if (event.candidate && ws && ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({
                            type: 'WEBRTC_ICE_CANDIDATE',
                            data: {
                                to_user_id: remoteUserId,
                                candidate: event.candidate
                            }
                        }));
                        log('ICE candidate sent', 'info');
                    }
                };

                // Handle remote stream
                peerConnection.ontrack = (event) => {
                    log('Received remote stream', 'success');
                    document.getElementById('remoteVideo').srcObject = event.streams[0];
                };

                // Create offer
                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);

                // Send offer via WebSocket
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({
                        type: 'WEBRTC_OFFER',
                        data: {
                            to_user_id: remoteUserId,
                            offer: offer
                        }
                    }));
                    log('Call offer sent', 'success');
                    updateStatus('callStatus', 'Calling', true);
                    document.getElementById('callBtn').disabled = true;
                    document.getElementById('hangupBtn').disabled = false;
                }
            } catch (error) {
                log(`Call error: ${error.message}`, 'error');
            }
        }

        async function handleOffer(data) {
            try {
                if (!localStream) {
                    await startLocalVideo();
                }

                peerConnection = new RTCPeerConnection(config);
                
                localStream.getTracks().forEach(track => {
                    peerConnection.addTrack(track, localStream);
                });

                peerConnection.onicecandidate = (event) => {
                    if (event.candidate && ws && ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({
                            type: 'WEBRTC_ICE_CANDIDATE',
                            data: {
                                to_user_id: data.from_user_id,
                                candidate: event.candidate
                            }
                        }));
                    }
                };

                peerConnection.ontrack = (event) => {
                    document.getElementById('remoteVideo').srcObject = event.streams[0];
                    log('Connected to remote peer', 'success');
                    updateStatus('callStatus', 'Active', true);
                };

                await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);

                ws.send(JSON.stringify({
                    type: 'WEBRTC_ANSWER',
                    data: {
                        to_user_id: data.from_user_id,
                        answer: answer
                    }
                }));

                remoteUserId = data.from_user_id;
                log('Call answer sent', 'success');
                document.getElementById('hangupBtn').disabled = false;
            } catch (error) {
                log(`Handle offer error: ${error.message}`, 'error');
            }
        }

        async function handleAnswer(data) {
            try {
                await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
                log('Call connected', 'success');
                updateStatus('callStatus', 'Active', true);
            } catch (error) {
                log(`Handle answer error: ${error.message}`, 'error');
            }
        }

        async function handleIceCandidate(data) {
            try {
                if (peerConnection) {
                    await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
                    log('ICE candidate added', 'info');
                }
            } catch (error) {
                log(`ICE candidate error: ${error.message}`, 'error');
            }
        }

        function handleCallInitiated(data) {
            log(`Incoming call from ${data.from_user_id}`, 'info');
            remoteUserId = data.from_user_id;
        }

        function handleCallEnded(data) {
            log('Call ended', 'info');
            hangup();
        }

        function hangup() {
            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }

            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }

            document.getElementById('localVideo').srcObject = null;
            document.getElementById('remoteVideo').srcObject = null;

            updateStatus('callStatus', 'Idle', false);
            updateStatus('localStatus', 'Not Started', false);
            
            document.getElementById('startLocalBtn').disabled = false;
            document.getElementById('callBtn').disabled = false;
            document.getElementById('hangupBtn').disabled = true;

            log('Call ended', 'info');
        }

        // Initialize on load
        log('Application started', 'success');
    </script>
</body>
</html>
